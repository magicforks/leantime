#statusBar { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #ddd; padding: 5px 10px; border-radius: 6px; font-size: 12px; pointer-events: none; }

<script>
'use strict';

// ===== CONSTANTS =====
const TILE = 48;
const ISO_W = 96;
const ISO_H = 48;
const ISO_Z = 32;
const WORLD_W = 70;
const WORLD_H = 70;
const CANVAS_W = 900;
const CANVAS_H = 600;

const T = { GRASS:0, FLOWER:1, DIRT:2, STABLE_FLOOR:3, STALL:4, WALL:5, FENCE:6, TREE:7, WATER:8, ARENA:9, PATH:10, PADDOCK:11 };
const SOLID = new Set([T.WALL, T.FENCE, T.TREE]);

// ===== WORLD =====
class World {
  constructor() {
    this.tiles = [];
    this.time = 0;
    this.generate();
  }
  generate() {
    // Fill with grass
    for (let r = 0; r < WORLD_H; r++) {
      this.tiles[r] = [];
      for (let c = 0; c < WORLD_W; c++) {
        this.tiles[r][c] = T.GRASS;
      }
    }
    this._addFlowers();
    this._addStable();
    this._addArena();
    this._addPaddocks();
    this._addTrail();
    this._addPond();
    this._addTrees();
    this._addPaths();
  }
  set(r,c,t) { if(r>=0&&r<WORLD_H&&c>=0&&c<WORLD_W) this.tiles[r][c]=t; }
  get(r,c) { if(r<0||r>=WORLD_H||c<0||c>=WORLD_W) return T.WALL; return this.tiles[r][c]; }
  isSolid(r,c) { return SOLID.has(this.get(r,c)); }

  _addFlowers() {
    const positions = [
      [3,10],[3,15],[4,8],[4,22],[5,3],[7,50],[8,55],[9,60],[2,62],[3,65],
      [10,2],[12,4],[14,7],[15,3],[2,20],[4,25],[6,28],[1,35],[2,40],[3,45],
      [18,50],[19,55],[20,60],[21,65],[22,50],[23,55],[1,5],[1,8],[1,12]
    ];
    for (const [r,c] of positions) this.set(r,c,T.FLOWER);
  }
  _addStable() {
    // Stable: rows 5-15, cols 30-45
    for (let r=5; r<=15; r++) for (let c=30; c<=45; c++) {
      if (r===5||r===15) { this.set(r,c,T.WALL); }
      else if (c===30||c===45) { this.set(r,c,T.WALL); }
      else { this.set(r,c,T.STABLE_FLOOR); }
    }
    // Door gap south wall cols 37-38
    this.set(15,37,T.STABLE_FLOOR);
    this.set(15,38,T.STABLE_FLOOR);
    // Stalls: 3 left, 3 right, corridor middle (cols 37-38)
    const stallRows = [6,8,10];
    for (const sr of stallRows) {
      // Left stalls cols 31-35
      for (let r=sr; r<=sr+1; r++) for (let c=31; c<=35; c++) this.set(r,c,T.STALL);
      this.set(sr+2,31,T.WALL); this.set(sr+2,32,T.WALL); this.set(sr+2,33,T.WALL);
      this.set(sr+2,34,T.WALL); this.set(sr+2,35,T.WALL);
      // Right stalls cols 40-44
      for (let r=sr; r<=sr+1; r++) for (let c=40; c<=44; c++) this.set(r,c,T.STALL);
      this.set(sr+2,40,T.WALL); this.set(sr+2,41,T.WALL); this.set(sr+2,42,T.WALL);
      this.set(sr+2,43,T.WALL); this.set(sr+2,44,T.WALL);
    }
    // Shop/notice area top of stable
    for (let c=32; c<=43; c++) this.set(5,c,T.WALL);
    // Corridor
    for (let r=6; r<=14; r++) { this.set(r,36,T.STABLE_FLOOR); this.set(r,37,T.STABLE_FLOOR); this.set(r,38,T.STABLE_FLOOR); this.set(r,39,T.STABLE_FLOOR); }
  }
  _addArena() {
    // Arena rows 22-37, cols 5-25
    for (let r=22; r<=37; r++) for (let c=5; c<=25; c++) this.set(r,c,T.ARENA);
    // Fence border
    for (let c=5; c<=25; c++) { this.set(22,c,T.FENCE); this.set(37,c,T.FENCE); }
    for (let r=22; r<=37; r++) { this.set(r,5,T.FENCE); this.set(r,25,T.FENCE); }
    // Gate opening south cols 14-15
    this.set(37,14,T.ARENA); this.set(37,15,T.ARENA);
    // Small dirt path to arena
    for (let r=38; r<=41; r++) { this.set(r,14,T.PATH); this.set(r,15,T.PATH); }
  }
  _addPaddocks() {
    // Paddock 1: rows 5-18, cols 48-58
    for (let r=5; r<=18; r++) for (let c=48; c<=58; c++) this.set(r,c,T.PADDOCK);
    for (let c=48; c<=58; c++) { this.set(5,c,T.FENCE); this.set(18,c,T.FENCE); }
    for (let r=5; r<=18; r++) { this.set(r,48,T.FENCE); this.set(r,58,T.FENCE); }
    this.set(18,52,T.PADDOCK); this.set(18,53,T.PADDOCK); // gate
    // Paddock 2: rows 5-18, cols 60-68
    for (let r=5; r<=18; r++) for (let c=60; c<=68; c++) this.set(r,c,T.PADDOCK);
    for (let c=60; c<=68; c++) { this.set(5,c,T.FENCE); this.set(18,c,T.FENCE); }
    for (let r=5; r<=18; r++) { this.set(r,60,T.FENCE); this.set(r,68,T.FENCE); }
    this.set(18,63,T.PADDOCK); this.set(18,64,T.PADDOCK); // gate
  }
  _addTrail() {
    // Trail rows 37-69, cols 32-38
    for (let r=37; r<=69; r++) for (let c=32; c<=38; c++) this.set(r,c,T.PATH);
    // Trees along trail
    for (let r=40; r<=68; r+=4) {
      this.set(r,30,T.TREE); this.set(r,39,T.TREE);
      this.set(r+2,29,T.TREE); this.set(r+2,40,T.TREE);
    }
  }
  _addPond() {
    // Pond rows 38-45, cols 10-20
    for (let r=38; r<=45; r++) for (let c=10; c<=20; c++) {
      const dist = Math.abs(r-41.5)/3.5 + Math.abs(c-15)/5;
      if (dist < 1) this.set(r,c,T.WATER);
    }
    // Some flowers around pond
    for (let c=9; c<=21; c+=2) { this.set(37,c,T.FLOWER); this.set(46,c,T.FLOWER); }
  }
  _addTrees() {
    const treePos = [
      [2,2],[2,5],[3,63],[4,67],[5,69],[6,1],[8,3],[9,68],[10,66],
      [12,1],[15,69],[17,1],[18,66],[19,2],[20,68],[21,3],[23,67],
      [25,2],[27,68],[30,3],[32,67],[35,2],[36,68],[38,2],[40,3],
      [41,68],[43,3],[44,25],[45,26],[46,27],[47,2],[48,68],[50,3],
      [52,68],[54,3],[56,68],[58,2],[60,68],[62,3],[64,68],[66,2],[68,69],
      [35,50],[36,55],[37,60],[38,62],[40,65],[42,50],[44,60],[46,65],
      [47,50],[49,55],[50,58],[52,62],[54,50],[56,57],[58,65],[60,50],
      [62,55],[64,58],[66,62]
    ];
    for (const [r,c] of treePos) { if(this.get(r,c)===T.GRASS||this.get(r,c)===T.FLOWER) this.set(r,c,T.TREE); }
  }
  _addPaths() {
    // Dirt path from stable door to arena
    for (let r=16; r<=21; r++) { this.set(r,36,T.DIRT); this.set(r,37,T.DIRT); this.set(r,38,T.DIRT); }
    // Path from stable to paddocks
    for (let c=46; c<=48; c++) { for (let r=10; r<=12; r++) this.set(r,c,T.DIRT); }
    // Path from arena southward connecting to trail
    for (let r=38; r<=41; r++) this.set(r,37,T.PATH);
    // Horizontal connector
    for (let c=26; c<=31; c++) { this.set(40,c,T.PATH); }
    // dirt around stable entrance
    for (let c=34; c<=41; c++) this.set(16,c,T.DIRT);
  }
}

// ===== HORSE BREEDS =====
const BREEDS = [
  {name:'Hannoveraner', speed:7, stamina:8, jump:6, dressage:7, cost:100, color:'#8B4513'},
  {name:'Holsteiner',   speed:8, stamina:7, jump:8, dressage:6, cost:150, color:'#4A3728'},
  {name:'Trakehner',    speed:9, stamina:7, jump:7, dressage:8, cost:120, color:'#2F1B0E'},
  {name:'Arab. Vollblut',speed:10,stamina:6,jump:6, dressage:7, cost:130, color:'#C4A27A'},
  {name:'Andalusier',   speed:7, stamina:8, jump:6, dressage:9, cost:140, color:'#E8E0D0'},
  {name:'Isländer',     speed:6, stamina:10,jump:5, dressage:6, cost:80,  color:'#C8A050'},
  {name:'Lipizzaner',   speed:7, stamina:8, jump:7, dressage:10,cost:160, color:'#F0EEE8'},
  {name:'Westfale',     speed:7, stamina:8, jump:8, dressage:7, cost:110, color:'#6B4226'},
  {name:'Haflinger',    speed:6, stamina:9, jump:6, dressage:6, cost:75,  color:'#D4882A'},
  {name:'Rheinländer',  speed:8, stamina:7, jump:7, dressage:7, cost:115, color:'#5C3317'}
];

const EQUIPMENT_ITEMS = {
  saddles: [
    {name:'Western-Sattel',   cost:80,  type:'saddle', color:'#8B4513'},
    {name:'Spring-Sattel',    cost:120, type:'saddle', color:'#6B3410'},
    {name:'Dressur-Sattel',   cost:100, type:'saddle', color:'#3D1C08'},
    {name:'Allround-Sattel',  cost:90,  type:'saddle', color:'#A0522D'}
  ],
  bridles: [
    {name:'Trense',   cost:40, type:'bridle', color:'#4A2800'},
    {name:'Kandare',  cost:70, type:'bridle', color:'#2A1800'}
  ],
  blankets: [
    {name:'Fleece-Decke',           cost:30, type:'blanket', color:'#6080C0'},
    {name:'Regendecke',             cost:45, type:'blanket', color:'#3A5A3A'},
    {name:'Turnierschabracke',      cost:65, type:'blanket', color:'#800020'}
  ]
};

// ===== HORSE CLASS =====
class Horse {
  constructor(breedIdx, name) {
    const b = BREEDS[breedIdx];
    this.breed = b.name;
    this.name = name || b.name;
    this.color = b.color;
    this.speed = b.speed;
    this.stamina = b.stamina;
    this.jump = b.jump;
    this.dressage = b.dressage;
    this.happiness = 80;
    this.energy = 100;
    this.equipment = { saddle: null, bridle: null, blanket: null };
    this.x = 0; this.y = 0;
    this.dir = 'down';
    this.animT = 0;
  }
}

// ===== DRAW HORSE =====
function drawHorse(ctx, sx, sy, color, direction, t, equipment, scale) {
  scale = scale || 1;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(scale, scale);

  const moving = t > 0;
  const legAnim = moving ? Math.sin(t * 5.5) * 7 : 0;
  const bodyBob = moving ? Math.abs(Math.sin(t * 5.5)) * 2.5 : 0;

  // Shadow on ground (stays at tile level even after horse is lifted)
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(2, 0, 22, 7, -0.2, 0, Math.PI*2);
  ctx.fill();

  // Lift horse 20px so hooves sit at ground level (sy) instead of sy+21
  ctx.translate(0, -20);

  let angle = 0;
  if (direction === 'left') angle = 0.4;
  else if (direction === 'right') angle = -0.4;
  else if (direction === 'up') angle = 0.2;
  else angle = -0.2;

  ctx.rotate(angle);

  // Back legs (draw before body)
  ctx.strokeStyle = shadeColor(color, -25);
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 2 - bodyBob); ctx.lineTo(-12 + legAnim*0.3, 18 - bodyBob + Math.abs(legAnim)*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2, 4 - bodyBob); ctx.lineTo(-1 - legAnim*0.3, 20 - bodyBob); ctx.stroke();

  // Blanket (under body)
  if (equipment && equipment.blanket) {
    ctx.fillStyle = equipment.blanket.color;
    ctx.globalAlpha = 0.75;
    ctx.beginPath(); ctx.ellipse(2, -4 - bodyBob, 16, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Body
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(2, -3 - bodyBob, 20, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(color, -35); ctx.lineWidth = 1; ctx.stroke();

  // Body shading (isometric lighting from top-left)
  const bodyGrad = ctx.createLinearGradient(-20, -14, 20, 8);
  bodyGrad.addColorStop(0, shadeColor(color, 20));
  bodyGrad.addColorStop(1, shadeColor(color, -15));
  ctx.fillStyle = bodyGrad;
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.ellipse(2, -3 - bodyBob, 20, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // Saddle
  if (equipment && equipment.saddle) {
    ctx.fillStyle = equipment.saddle.color;
    ctx.beginPath(); ctx.ellipse(4, -9 - bodyBob, 9, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = shadeColor(equipment.saddle.color, -30); ctx.lineWidth = 1; ctx.stroke();
  }

  // Front legs
  ctx.strokeStyle = shadeColor(color, -20);
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(10, 0 - bodyBob); ctx.lineTo(12 - legAnim*0.3, 16 - bodyBob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, 2 - bodyBob); ctx.lineTo(18 + legAnim*0.3, 18 - bodyBob); ctx.stroke();

  // Hooves
  ctx.fillStyle = '#222';
  [[-12 + legAnim*0.3, 19 - bodyBob], [-1 - legAnim*0.3, 21-bodyBob],
   [12 - legAnim*0.3, 17-bodyBob], [18 + legAnim*0.3, 19-bodyBob]].forEach(([hx,hy]) => {
    ctx.beginPath(); ctx.ellipse(hx, hy+1, 3, 2, 0, 0, Math.PI*2); ctx.fill();
  });

  // Neck
  ctx.strokeStyle = color; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(14, -6 - bodyBob); ctx.quadraticCurveTo(20, -14-bodyBob, 22, -20-bodyBob); ctx.stroke();

  // Head
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(25, -22 - bodyBob, 8, 5.5, 0.35, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(color,-30); ctx.lineWidth=1; ctx.stroke();

  // Nose/muzzle
  ctx.fillStyle = shadeColor(color, 10);
  ctx.beginPath(); ctx.ellipse(30, -18 - bodyBob, 4.5, 3.5, 0.3, 0, Math.PI*2); ctx.fill();

  // Nostril
  ctx.fillStyle = shadeColor(color, -40);
  ctx.beginPath(); ctx.arc(32, -17 - bodyBob, 1.2, 0, Math.PI*2); ctx.fill();

  // Eye
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(23, -24 - bodyBob, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(23, -24 - bodyBob, 0.8, 0, Math.PI*2); ctx.fill();

  // Mane
  ctx.strokeStyle = shadeColor(color, -55); ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(15, -8-bodyBob); ctx.quadraticCurveTo(18, -16-bodyBob, 22, -20-bodyBob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -6-bodyBob); ctx.quadraticCurveTo(15, -14-bodyBob, 20, -18-bodyBob); ctx.stroke();

  // Tail
  ctx.strokeStyle = shadeColor(color, -45); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-16, -2-bodyBob); ctx.quadraticCurveTo(-26, 6-bodyBob, -24, 18-bodyBob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-16, -2-bodyBob); ctx.quadraticCurveTo(-28, 4-bodyBob, -30, 0-bodyBob); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-16, -2-bodyBob); ctx.quadraticCurveTo(-25, 8-bodyBob, -20, 22-bodyBob); ctx.stroke();

  // Bridle
  if (equipment && equipment.bridle) {
    ctx.strokeStyle = equipment.bridle.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(25, -21-bodyBob, 6, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22,-16-bodyBob); ctx.lineTo(24,-13-bodyBob); ctx.stroke();
  }

  ctx.restore();
}

// ===== DRAW RIDER =====
function drawRider(ctx, sx, sy, direction, outfit) {
  ctx.save();
  ctx.translate(sx, sy);

  let angle = direction==='left'?0.4:direction==='right'?-0.4:direction==='up'?0.2:-0.2;
  ctx.rotate(angle);

  // Boots/lower legs
  ctx.fillStyle = outfit.bootsColor || '#2c1810';
  ctx.fillRect(-5, -10, 4, 7);
  ctx.fillRect(3, -10, 4, 7);

  // Pants
  ctx.fillStyle = outfit.pantsColor || '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(0, -18, 7, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillRect(-5, -22, 10, 8);

  // Jacket body
  ctx.fillStyle = outfit.jacketColor || '#1a3a5c';
  ctx.fillRect(-6, -36, 13, 16);

  // Left arm
  ctx.fillStyle = shadeColor(outfit.jacketColor || '#1a3a5c', -20);
  ctx.fillRect(-10, -36, 4, 10);
  // Right arm
  ctx.fillStyle = outfit.jacketColor || '#1a3a5c';
  ctx.fillRect(7, -35, 4, 10);

  // Hands
  ctx.fillStyle = '#F5C5A0';
  ctx.beginPath(); ctx.arc(-8, -26, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -25, 2.5, 0, Math.PI*2); ctx.fill();

  // Head/face
  ctx.fillStyle = '#F5C5A0';
  ctx.beginPath(); ctx.arc(1, -44, 6, 0, Math.PI*2); ctx.fill();

  // Helmet
  ctx.fillStyle = outfit.helmetColor || '#1a1a1a';
  ctx.beginPath(); ctx.arc(1, -44, 6.5, Math.PI, 0); ctx.fill();
  ctx.fillRect(-7, -44, 15, 3);

  // Helmet brim
  ctx.fillStyle = shadeColor(outfit.helmetColor || '#1a1a1a', -15);
  ctx.fillRect(-8, -44, 17, 2);

  ctx.restore();
}

function shadeColor(hex, amount) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0,Math.min(255,r+amount));
  g = Math.max(0,Math.min(255,g+amount));
  b = Math.max(0,Math.min(255,b+amount));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// World tile → screen pixel — continuous isometric projection with free camera orbit
function tileToScreen(tx, ty) {
  const ptx = Game.player ? Game.player.x / TILE : WORLD_W / 2;
  const pty = Game.player ? Game.player.y / TILE : WORLD_H / 2;
  const dx = tx - ptx, dy = ty - pty;
  const ca = Math.cos(camAngle), sa = Math.sin(camAngle);
  // Rotate tile coords around player, then project isometrically
  const hw = (ISO_W / 2) * camZoom;
  const hh = camPitchH * camZoom;
  return {
    x: (dx * (ca - sa) - dy * (sa + ca)) * hw + CANVAS_W / 2,
    y: (dx * (ca + sa) + dy * (ca - sa)) * hh + CANVAS_H / 3
  };
}
function worldToScreen(wx, wy) {
  return tileToScreen(wx / TILE, wy / TILE);
}

function drawIsoDiamond(ctx, sx, sy, color, strokeColor) {
  ctx.beginPath();
  ctx.moveTo(sx,          sy - ISO_H/2);
  ctx.lineTo(sx + ISO_W/2, sy);
  ctx.lineTo(sx,          sy + ISO_H/2);
  ctx.lineTo(sx - ISO_W/2, sy);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = 0.5; ctx.stroke(); }
}

function drawIsoBlock(ctx, sx, sy, topColor, wallH) {
  const h = wallH || ISO_Z;
  // Left face (darkest)
  ctx.beginPath();
  ctx.moveTo(sx - ISO_W/2, sy - h);
  ctx.lineTo(sx, sy - h + ISO_H/2);
  ctx.lineTo(sx, sy + ISO_H/2);
  ctx.lineTo(sx - ISO_W/2, sy);
  ctx.closePath();
  ctx.fillStyle = shadeColor(topColor, -60);
  ctx.fill();
  // Right face
  ctx.beginPath();
  ctx.moveTo(sx, sy - h + ISO_H/2);
  ctx.lineTo(sx + ISO_W/2, sy - h);
  ctx.lineTo(sx + ISO_W/2, sy);
  ctx.lineTo(sx, sy + ISO_H/2);
  ctx.closePath();
  ctx.fillStyle = shadeColor(topColor, -35);
  ctx.fill();
  // Top face
  drawIsoDiamond(ctx, sx, sy - h, topColor, 'rgba(0,0,0,0.1)');
}

// ===== NPC =====
class NPC {
  constructor(name, horseColor, startR, startC) {
    this.name = name;
    this.x = startC*TILE+24;
    this.y = startR*TILE+24;
    this.dir = 'down';
    this.horse = new Horse(Math.floor(Math.random()*10), name+"s Pferd");
    this.horse.color = horseColor;
    this.animT = 0;
    this.moving = false;
    this.wanderTimer = Math.random()*3;
    this.wanderDir = null;
    this.wanderDuration = 0;
    this.speed = 60;
  }
  update(dt, world) {
    this.animT += dt;
    this.wanderTimer -= dt;
    if (this.wanderTimer <= 0) {
      const dirs = ['up','down','left','right',null,null];
      this.wanderDir = dirs[Math.floor(Math.random()*dirs.length)];
      this.wanderDuration = 0.5 + Math.random()*1.5;
      this.wanderTimer = this.wanderDuration + Math.random()*2;
    }
    if (this.wanderDir) {
      const speed = this.speed;
      let nx=this.x, ny=this.y;
      if (this.wanderDir==='up') { ny-=speed*dt; this.dir='up'; }
      else if (this.wanderDir==='down') { ny+=speed*dt; this.dir='down'; }
      else if (this.wanderDir==='left') { nx-=speed*dt; this.dir='left'; }
      else if (this.wanderDir==='right') { nx+=speed*dt; this.dir='right'; }
      if (!this._collides(nx, this.y, world)) this.x=nx;
      if (!this._collides(this.x, ny, world)) this.y=ny;
      this.x=Math.max(TILE,Math.min((WORLD_W-2)*TILE,this.x));
      this.y=Math.max(TILE,Math.min((WORLD_H-2)*TILE,this.y));
      this.moving = true;
    } else { this.moving = false; }
  }
  _collides(px, py, world) {
    const hw=8;
    const corners = [[px-hw,py-hw],[px+hw,py-hw],[px-hw,py+hw],[px+hw,py+hw]];
    for (const [cx,cy] of corners) {
      const r=Math.floor(cy/TILE), c=Math.floor(cx/TILE);
      if (world.isSolid(r,c)) return true;
    }
    return false;
  }
}

// ===== INPUT =====
const Input = {
  keys: {},
  init() {
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (!this.keys[k]) {
        this.keys[k] = true;
        this.onKeyDown(k, e);
      }
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) ||
          ['w','a','s','d'].includes(k)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => {
      this.keys[e.key.toLowerCase()] = false;
    });
  },
  onKeyDown(k, e) {
    if (k==='e') Game.interact();
    if (k==='l') Game.toggleLead();
    if (k==='escape') {
      if (Training.active) { Training.finish(); UI.notify('Training abgebrochen.'); }
      else if (TrailRide.active) { TrailRide.finish(); UI.notify('Trail abgebrochen.'); }
      else if (Tournament.active) { Tournament.finish(); UI.notify('Turnier abgebrochen.'); }
      else UI.closePanel();
    }
    if (k==='tab') { e.preventDefault(); UI.toggleInventory(); }
    if (k===' ') Game.actionPress();
    if (k==='c') { camAngle=0; camPitchH=ISO_H/2; camZoom=1.0; UI.notify('Kamera zurückgesetzt'); }
    if (k==='q') { camAngle -= Math.PI/2; }
    if (k==='r') { camAngle += Math.PI/2; }
  },
  isDown(k) { return !!this.keys[k]; }
};

// ===== TRAINING (WORLD-BASED) =====
const Training = {
  active: false,
  phase: 0,
  phases: ['Schritt','Trab','Galopp','Sprung'],
  score: 0,
  checkpoints: [],
  nextCheckpoint: 0,
  phaseTimer: 0,
  jumpObstacleX: 0,
  jumpObstacleY: 0,
  jumpDone: false,
  jumpWindow: false,
  _t: 0,

  start() {
    if (!Game.player.activeHorse) { UI.notify('Du brauchst ein Pferd!'); return; }
    this.active = true;
    this.phase = 0;
    this.score = 0;
    this._t = 0;
    UI.hidePrompt();
    this._setupPhase();
    UI.notify('Training gestartet! Reite durch die Markierungen!');
  },

  _setupPhase() {
    this.nextCheckpoint = 0;
    this.jumpWindow = false;
    // Arena: rows 23-36, cols 6-24 (fence at rows 22,37 cols 5,25)
    if (this.phase === 0) {
      this.checkpoints = [
        {x:10*TILE, y:25*TILE, done:false},
        {x:20*TILE, y:25*TILE, done:false},
        {x:20*TILE, y:34*TILE, done:false},
        {x:10*TILE, y:34*TILE, done:false},
      ];
      this.phaseTimer = 60;
    } else if (this.phase === 1) {
      this.checkpoints = [
        {x:9*TILE,  y:24*TILE, done:false},
        {x:21*TILE, y:24*TILE, done:false},
        {x:21*TILE, y:35*TILE, done:false},
        {x:9*TILE,  y:35*TILE, done:false},
        {x:15*TILE, y:29*TILE, done:false},
      ];
      this.phaseTimer = 45;
    } else if (this.phase === 2) {
      this.checkpoints = [
        {x:9*TILE,  y:24*TILE, done:false},
        {x:21*TILE, y:35*TILE, done:false},
        {x:9*TILE,  y:35*TILE, done:false},
        {x:21*TILE, y:24*TILE, done:false},
      ];
      this.phaseTimer = 30;
    } else if (this.phase === 3) {
      this.jumpDone = false;
      this.jumpObstacleX = 15*TILE;
      this.jumpObstacleY = 29*TILE;
      this.checkpoints = [
        {x:8*TILE,  y:29*TILE, done:false},
        {x:22*TILE, y:29*TILE, done:false},
      ];
      this.phaseTimer = 30;
    }
    const hints = ['Reite durch alle orangen Kegel!','Trab! Reite durch alle Kegel!','Galopp! Sprint durch alle Kegel!','Springe über das rote Hindernis! (LEERTASTE)'];
    UI.notify(this.phases[this.phase] + ' — ' + hints[this.phase]);
  },

  update(dt) {
    if (!this.active) return;
    this._t += dt;
    this.phaseTimer -= dt;
    const p = Game.player;
    if (this.nextCheckpoint < this.checkpoints.length) {
      const cp = this.checkpoints[this.nextCheckpoint];
      const dx = p.x - cp.x, dy = p.y - cp.y;
      if (Math.sqrt(dx*dx+dy*dy) < 52) {
        cp.done = true;
        this.score += 10;
        this.nextCheckpoint++;
        if (this.nextCheckpoint >= this.checkpoints.length && (this.phase !== 3 || this.jumpDone)) {
          this._advancePhase(); return;
        }
      }
    }
    if (this.phase === 3 && !this.jumpDone) {
      const dx = p.x - this.jumpObstacleX, dy = p.y - this.jumpObstacleY;
      this.jumpWindow = Math.sqrt(dx*dx+dy*dy) < 80;
    } else { this.jumpWindow = false; }
    if (this.phaseTimer <= 0) {
      UI.notify('Zeit abgelaufen für ' + this.phases[this.phase]);
      this._advancePhase();
    }
  },

  _advancePhase() {
    this.score += 25;
    this.phase++;
    if (this.phase >= this.phases.length) { this.finish(); return; }
    this._setupPhase();
  },

  actionPress() {
    if (!this.active || this.phase !== 3 || !this.jumpWindow || this.jumpDone) return;
    this.jumpDone = true;
    this.score += 30;
    UI.notify('Perfekter Sprung! 🏆');
    this.checkpoints.forEach(c => c.done = true);
    this.nextCheckpoint = this.checkpoints.length;
    this._advancePhase();
  },

  finish() {
    if (!this.active) return;
    this.active = false;
    const earned = 20 + Math.floor(this.score / 2);
    Economy.earn(earned, 'Training abgeschlossen!');
    const horse = Game.player.activeHorse;
    if (horse) {
      horse.speed = Math.min(10, horse.speed + 0.1);
      horse.stamina = Math.min(10, horse.stamina + 0.1);
      horse.happiness = Math.min(100, horse.happiness + 10);
    }
    UI.notify(`Training beendet! ${this.score} Punkte | +${earned} Münzen | Pferd verbessert!`);
  },
};

// ===== TRAIL RIDE (WORLD-BASED) =====
const TrailRide = {
  active: false,
  _t: 0,
  elapsed: 0,
  duration: 90,
  coins: [],
  obstacles: [],
  coinsCollected: 0,
  jumpWindow: false,
  jumpWindowObs: null,

  start() {
    if (!Game.player.activeHorse) { UI.notify('Du brauchst ein Pferd!'); return; }
    this.active = true;
    this._t = 0;
    this.elapsed = 0;
    this.coinsCollected = 0;
    this.jumpWindow = false;
    this.jumpWindowObs = null;
    UI.hidePrompt();
    // Trail: rows 37-69, cols 32-38
    this.coins = [];
    const coinRows = [42, 46, 50, 53, 56, 59, 62, 65];
    const coinCols = [35, 33, 36, 34, 37, 33, 35, 36];
    for (let i = 0; i < coinRows.length; i++) {
      this.coins.push({x: coinCols[i]*TILE+12, y: coinRows[i]*TILE+12, collected: false});
    }
    this.obstacles = [
      {x:35*TILE+12, y:48*TILE+12, cleared:false, _wasClose:false},
      {x:34*TILE+12, y:57*TILE+12, cleared:false, _wasClose:false},
      {x:36*TILE+12, y:63*TILE+12, cleared:false, _wasClose:false},
    ];
    UI.notify('Trail-Ausritt! Reite zum Ziel am Ende des Pfades! LEERTASTE = Springen!');
  },

  update(dt) {
    if (!this.active) return;
    this._t += dt;
    this.elapsed += dt;
    const p = Game.player;
    for (const c of this.coins) {
      if (!c.collected) {
        const dx = p.x-c.x, dy = p.y-c.y;
        if (Math.sqrt(dx*dx+dy*dy) < 44) { c.collected = true; this.coinsCollected++; UI.notify('Münze! 💰'); }
      }
    }
    this.jumpWindow = false;
    this.jumpWindowObs = null;
    for (const obs of this.obstacles) {
      if (!obs.cleared) {
        const dx = p.x-obs.x, dy = p.y-obs.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist < 80) { this.jumpWindow = true; this.jumpWindowObs = obs; }
        if (obs._wasClose && dist > 160) obs.cleared = true;
        if (dist < 100) obs._wasClose = true;
      }
    }
    if (p.y > 68*TILE) this.finish();
    if (this.elapsed >= this.duration) this.finish();
  },

  actionPress() {
    if (!this.active || !this.jumpWindow || !this.jumpWindowObs) return;
    const obs = this.jumpWindowObs;
    if (!obs.cleared) {
      obs.cleared = true;
      this.coinsCollected += 2;
      UI.notify('Sprung! 🦘 +2 Münzen Bonus!');
      this.jumpWindow = false;
      this.jumpWindowObs = null;
    }
  },

  finish() {
    if (!this.active) return;
    this.active = false;
    const earned = 30 + this.coinsCollected * 5;
    Economy.earn(earned, 'Trail-Ausritt abgeschlossen!');
    UI.notify(`Trail beendet! ${this.coinsCollected} Münzen | +${earned} 💰`);
    if (Game.player.activeHorse) {
      Game.player.activeHorse.happiness = Math.min(100, Game.player.activeHorse.happiness + 15);
      Game.player.activeHorse.energy = Math.max(0, Game.player.activeHorse.energy - 20);
    }
  }
};

      this.obstacles = [

      ];
      UI.notify('Springturnier! Reite zu den Hindernissen und drücke LEERTASTE!');
    } else {
      this.dressagePhase = 0;
      this.dressageScore = 0;
      this.dressageTimer = 15;
      // Dressage letter markers around the arena perimeter (inside fence)
      this.dressageLetters = [
        {label:'A', x:15*TILE, y:36*TILE, done:false},
        {label:'K', x:8*TILE,  y:35*TILE, done:false},
        {label:'E', x:7*TILE,  y:29*TILE, done:false},
        {label:'H', x:8*TILE,  y:24*TILE, done:false},
        {label:'C', x:15*TILE, y:23*TILE, done:false},
        {label:'M', x:22*TILE, y:24*TILE, done:false},

        {label:'F', x:22*TILE, y:35*TILE, done:false},
      ];

  update(dt) {
    if (!this.active) return;
    this._t += dt;
    this.elapsed += dt;
    if (this.type === 'jumping') this._updateJumping();
    else this._updateDressage(dt);
  },

  _updateJumping() {
    if (this.jumpIdx >= this.obstacles.length) { this.finish(); return; }
    const p = Game.player;
    const obs = this.obstacles[this.jumpIdx];
    const dx = p.x - obs.x, dy = p.y - obs.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    this.jumpWindow = dist < 80;
    if (dist < 110) obs._wasClose = true;
    if (obs._wasClose && dist > 160 && !obs.cleared && !obs.missed) {
      obs.missed = true;
      this.faults += 4;
      this.jumpWindow = false;
      UI.notify('Hindernis verpasst! +4 Strafpunkte');
      this.jumpIdx++;
    }
  },

    if (!this.active || this.type !== 'jumping') return;
    if (this.jumpWindow && this.jumpIdx < this.obstacles.length) {
      const obs = this.obstacles[this.jumpIdx];
      if (!obs.cleared && !obs.missed) {
        obs.cleared = true;
        this.jumpWindow = false;
        UI.notify('Perfekter Sprung! ✓');
        this.jumpIdx++;
        if (this.jumpIdx >= this.obstacles.length) this.finish();
      }
    }
  },

  _updateDressage(dt) {
    if (this.dressagePhase >= this.dressageLetters.length) { this.finish(); return; }
    this.dressageTimer -= dt;
    const p = Game.player;
    const letter = this.dressageLetters[this.dressagePhase];
    const dx = p.x - letter.x, dy = p.y - letter.y;
    if (Math.sqrt(dx*dx + dy*dy) < 65) {
      const pts = Math.max(5, Math.floor(this.dressageTimer / 15 * 20) + 5);
      this.dressageScore += pts;
      letter.done = true;
      UI.notify(`${letter.label}! +${pts} Punkte`);
      this.dressagePhase++;
      this.dressageTimer = 15;
      if (this.dressagePhase >= this.dressageLetters.length) { this.finish(); return; }
    } else if (this.dressageTimer <= 0) {
      UI.notify(`${letter.label} verpasst!`);
      this.dressagePhase++;
      this.dressageTimer = 15;
      if (this.dressagePhase >= this.dressageLetters.length) { this.finish(); return; }
    }
  },

  finish() {
    if (!this.active) return;
    this.active = false;
    let placement, earned;
    if (this.type === 'jumping') {
      const perf = Math.max(0, 100 - this.faults * 5);
      placement = perf >= 80 ? 1 : perf >= 50 ? 2 : 3;
    } else {
      const maxScore = 8 * 25;
      placement = this.dressageScore >= maxScore * 0.8 ? 1 : this.dressageScore >= maxScore * 0.5 ? 2 : 3;
    }
    earned = placement === 1 ? 200 : placement === 2 ? 100 : 50;
    Economy.earn(earned, 'Turnier abgeschlossen!');
    const medals = ['🥇','🥈','🥉'];
    UI.showPanel('Turnierergebnis', `
      <div style="text-align:center;padding:20px">
        <div style="font-size:60px">${medals[placement-1]}</div>
        <div style="font-size:22px;color:#FFD700;margin:12px 0">${placement}. Platz!</div>
        <div style="color:#90EE90;font-size:18px">+${earned} Münzen</div>
        ${this.type==='jumping' ? `<div style="color:#aaa;margin-top:8px">Strafpunkte: ${this.faults}</div>` : `<div style="color:#aaa;margin-top:8px">Punkte: ${this.dressageScore}</div>`}
        <button class="btn btn-primary" style="margin-top:16px;padding:10px 24px" onclick="UI.closePanel()">Schließen</button>
      </div>
    `);
  }
};
