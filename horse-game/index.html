#statusBar { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #ddd; padding: 5px 10px; border-radius: 6px; font-size: 12px; pointer-events: none; }

<script>
'use strict';

// ===== CONSTANTS =====
const TILE = 48;
const ISO_W = 96;
const ISO_H = 48;
const ISO_Z = 32;
const WORLD_W = 70;
const WORLD_H = 70;
const CANVAS_W = 900;
const CANVAS_H = 600;

const T = { GRASS:0, FLOWER:1, DIRT:2, STABLE_FLOOR:3, STALL:4, WALL:5, FENCE:6, TREE:7, WATER:8, ARENA:9, PATH:10, PADDOCK:11 };
const SOLID = new Set([T.WALL, T.FENCE, T.TREE]);

// ===== WORLD =====
class World {
  constructor() {
    this.tiles = [];
    this.time = 0;
    this.generate();
  }
  generate() {
    // Fill with grass
    for (let r = 0; r < WORLD_H; r++) {
      this.tiles[r] = [];
      for (let c = 0; c < WORLD_W; c++) {
        this.tiles[r][c] = T.GRASS;
      }
    }
    this._addFlowers();
    this._addStable();
    this._addArena();
    this._addPaddocks();
    this._addTrail();
    this._addPond();
    this._addTrees();
    this._addPaths();
  }
  set(r,c,t) { if(r>=0&&r<WORLD_H&&c>=0&&c<WORLD_W) this.tiles[r][c]=t; }
  get(r,c) { if(r<0||r>=WORLD_H||c<0||c>=WORLD_W) return T.WALL; return this.tiles[r][c]; }
  isSolid(r,c) { return SOLID.has(this.get(r,c)); }

  _addFlowers() {
    const positions = [
      [3,10],[3,15],[4,8],[4,22],[5,3],[7,50],[8,55],[9,60],[2,62],[3,65],
      [10,2],[12,4],[14,7],[15,3],[2,20],[4,25],[6,28],[1,35],[2,40],[3,45],
      [18,50],[19,55],[20,60],[21,65],[22,50],[23,55],[1,5],[1,8],[1,12]
    ];
    for (const [r,c] of positions) this.set(r,c,T.FLOWER);
  }
  _addStable() {
    // Stable: rows 5-15, cols 30-45
    for (let r=5; r<=15; r++) for (let c=30; c<=45; c++) {
      if (r===5||r===15) { this.set(r,c,T.WALL); }
      else if (c===30||c===45) { this.set(r,c,T.WALL); }
      else { this.set(r,c,T.STABLE_FLOOR); }
    }
    // Door gap south wall cols 37-38
    this.set(15,37,T.STABLE_FLOOR);
    this.set(15,38,T.STABLE_FLOOR);
    // Stalls: 3 left, 3 right, corridor middle (cols 37-38)
    const stallRows = [6,8,10];
    for (const sr of stallRows) {
      // Left stalls cols 31-35
      for (let r=sr; r<=sr+1; r++) for (let c=31; c<=35; c++) this.set(r,c,T.STALL);
      this.set(sr+2,31,T.WALL); this.set(sr+2,32,T.WALL); this.set(sr+2,33,T.WALL);
      this.set(sr+2,34,T.WALL); this.set(sr+2,35,T.WALL);
      // Right stalls cols 40-44
      for (let r=sr; r<=sr+1; r++) for (let c=40; c<=44; c++) this.set(r,c,T.STALL);
      this.set(sr+2,40,T.WALL); this.set(sr+2,41,T.WALL); this.set(sr+2,42,T.WALL);
      this.set(sr+2,43,T.WALL); this.set(sr+2,44,T.WALL);
    }
    // Shop/notice area top of stable
    for (let c=32; c<=43; c++) this.set(5,c,T.WALL);
    // Corridor
    for (let r=6; r<=14; r++) { this.set(r,36,T.STABLE_FLOOR); this.set(r,37,T.STABLE_FLOOR); this.set(r,38,T.STABLE_FLOOR); this.set(r,39,T.STABLE_FLOOR); }
  }
  _addArena() {
    // Arena rows 22-37, cols 5-25
    for (let r=22; r<=37; r++) for (let c=5; c<=25; c++) this.set(r,c,T.ARENA);
    // Fence border
    for (let c=5; c<=25; c++) { this.set(22,c,T.FENCE); this.set(37,c,T.FENCE); }
    for (let r=22; r<=37; r++) { this.set(r,5,T.FENCE); this.set(r,25,T.FENCE); }
    // Gate opening south cols 14-15
    this.set(37,14,T.ARENA); this.set(37,15,T.ARENA);
    // Small dirt path to arena
    for (let r=38; r<=41; r++) { this.set(r,14,T.PATH); this.set(r,15,T.PATH); }
  }
  _addPaddocks() {
    // Paddock 1: rows 5-18, cols 48-58
    for (let r=5; r<=18; r++) for (let c=48; c<=58; c++) this.set(r,c,T.PADDOCK);
    for (let c=48; c<=58; c++) { this.set(5,c,T.FENCE); this.set(18,c,T.FENCE); }
    for (let r=5; r<=18; r++) { this.set(r,48,T.FENCE); this.set(r,58,T.FENCE); }
    this.set(18,52,T.PADDOCK); this.set(18,53,T.PADDOCK); // gate
    // Paddock 2: rows 5-18, cols 60-68
    for (let r=5; r<=18; r++) for (let c=60; c<=68; c++) this.set(r,c,T.PADDOCK);
    for (let c=60; c<=68; c++) { this.set(5,c,T.FENCE); this.set(18,c,T.FENCE); }
    for (let r=5; r<=18; r++) { this.set(r,60,T.FENCE); this.set(r,68,T.FENCE); }
    this.set(18,63,T.PADDOCK); this.set(18,64,T.PADDOCK); // gate
  }
  _addTrail() {
    // Trail rows 37-69, cols 32-38
    for (let r=37; r<=69; r++) for (let c=32; c<=38; c++) this.set(r,c,T.PATH);
    // Trees along trail
    for (let r=40; r<=68; r+=4) {
      this.set(r,30,T.TREE); this.set(r,39,T.TREE);
      this.set(r+2,29,T.TREE); this.set(r+2,40,T.TREE);
    }
  }
  _addPond() {
    // Pond rows 38-45, cols 10-20
    for (let r=38; r<=45; r++) for (let c=10; c<=20; c++) {
      const dist = Math.abs(r-41.5)/3.5 + Math.abs(c-15)/5;
      if (dist < 1) this.set(r,c,T.WATER);
    }
    // Some flowers around pond
    for (let c=9; c<=21; c+=2) { this.set(37,c,T.FLOWER); this.set(46,c,T.FLOWER); }
  }
  _addTrees() {
    const treePos = [
      [2,2],[2,5],[3,63],[4,67],[5,69],[6,1],[8,3],[9,68],[10,66],
      [12,1],[15,69],[17,1],[18,66],[19,2],[20,68],[21,3],[23,67],
      [25,2],[27,68],[30,3],[32,67],[35,2],[36,68],[38,2],[40,3],
      [41,68],[43,3],[44,25],[45,26],[46,27],[47,2],[48,68],[50,3],
      [52,68],[54,3],[56,68],[58,2],[60,68],[62,3],[64,68],[66,2],[68,69],
      [35,50],[36,55],[37,60],[38,62],[40,65],[42,50],[44,60],[46,65],
      [47,50],[49,55],[50,58],[52,62],[54,50],[56,57],[58,65],[60,50],
      [62,55],[64,58],[66,62]
    ];
    for (const [r,c] of treePos) { if(this.get(r,c)===T.GRASS||this.get(r,c)===T.FLOWER) this.set(r,c,T.TREE); }
  }
  _addPaths() {
    // Dirt path from stable door to arena
    for (let r=16; r<=21; r++) { this.set(r,36,T.DIRT); this.set(r,37,T.DIRT); this.set(r,38,T.DIRT); }
    // Path from stable to paddocks
    for (let c=46; c<=48; c++) { for (let r=10; r<=12; r++) this.set(r,c,T.DIRT); }
    // Path from arena southward connecting to trail
    for (let r=38; r<=41; r++) this.set(r,37,T.PATH);
    // Horizontal connector
    for (let c=26; c<=31; c++) { this.set(40,c,T.PATH); }
    // dirt around stable entrance
    for (let c=34; c<=41; c++) this.set(16,c,T.DIRT);
  }
}

// ===== HORSE BREEDS =====
const BREEDS = [
  {name:'Hannoveraner', speed:7, stamina:8, jump:6, dressage:7, cost:100, color:'#8B4513'},
  {name:'Holsteiner',   speed:8, stamina:7, jump:8, dressage:6, cost:150, color:'#4A3728'},
  {name:'Trakehner',    speed:9, stamina:7, jump:7, dressage:8, cost:120, color:'#2F1B0E'},
  {name:'Arab. Vollblut',speed:10,stamina:6,jump:6, dressage:7, cost:130, color:'#C4A27A'},
  {name:'Andalusier',   speed:7, stamina:8, jump:6, dressage:9, cost:140, color:'#E8E0D0'},
  {name:'Isländer',     speed:6, stamina:10,jump:5, dressage:6, cost:80,  color:'#C8A050'},
  {name:'Lipizzaner',   speed:7, stamina:8, jump:7, dressage:10,cost:160, color:'#F0EEE8'},
  {name:'Westfale',     speed:7, stamina:8, jump:8, dressage:7, cost:110, color:'#6B4226'},
  {name:'Haflinger',    speed:6, stamina:9, jump:6, dressage:6, cost:75,  color:'#D4882A'},
  {name:'Rheinländer',  speed:8, stamina:7, jump:7, dressage:7, cost:115, color:'#5C3317'}
];

const EQUIPMENT_ITEMS = {
  saddles: [
    {name:'Western-Sattel',   cost:80,  type:'saddle', color:'#8B4513'},
    {name:'Spring-Sattel',    cost:120, type:'saddle', color:'#6B3410'},
    {name:'Dressur-Sattel',   cost:100, type:'saddle', color:'#3D1C08'},
    {name:'Allround-Sattel',  cost:90,  type:'saddle', color:'#A0522D'}
  ],
  bridles: [
    {name:'Trense',   cost:40, type:'bridle', color:'#4A2800'},
    {name:'Kandare',  cost:70, type:'bridle', color:'#2A1800'}
  ],
  blankets: [
    {name:'Fleece-Decke',           cost:30, type:'blanket', color:'#6080C0'},
    {name:'Regendecke',             cost:45, type:'blanket', color:'#3A5A3A'},
    {name:'Turnierschabracke',      cost:65, type:'blanket', color:'#800020'}
  ]
};

// ===== HORSE CLASS =====
class Horse {
  constructor(breedIdx, name) {
    const b = BREEDS[breedIdx];
    this.breed = b.name;
    this.name = name || b.name;
    this.color = b.color;
    this.speed = b.speed;
    this.stamina = b.stamina;
    this.jump = b.jump;
    this.dressage = b.dressage;
    this.happiness = 80;
    this.energy = 100;
    this.equipment = { saddle: null, bridle: null, blanket: null };
    this.x = 0; this.y = 0;
    this.dir = 'down';
    this.animT = 0;
  }
}

// ===== DRAW HORSE =====
function drawHorse(ctx, sx, sy, color, direction, t, equipment, scale) {
  scale = scale || 1;
  ctx.save();
  ctx.translate(sx, sy);
  ctx.scale(scale, scale);

  const moving = t > 0;
  const legAnim = moving ? Math.sin(t * 5.5) * 7 : 0;
  const bodyBob = moving ? Math.abs(Math.sin(t * 5.5)) * 2.5 : 0;

  // Shadow on ground
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath();
  ctx.ellipse(2, 8, 22, 7, -0.2, 0, Math.PI*2);
  ctx.fill();

  let angle = 0;
  if (direction === 'left') angle = 0.4;
  else if (direction === 'right') angle = -0.4;
  else if (direction === 'up') angle = 0.2;
  else angle = -0.2;

  ctx.rotate(angle);

  // Back legs (draw before body)
  ctx.strokeStyle = shadeColor(color, -25);
  ctx.lineWidth = 5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 2 - bodyBob); ctx.lineTo(-12 + legAnim*0.3, 18 - bodyBob + Math.abs(legAnim)*0.2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-2, 4 - bodyBob); ctx.lineTo(-1 - legAnim*0.3, 20 - bodyBob); ctx.stroke();

  // Blanket (under body)
  if (equipment && equipment.blanket) {
    ctx.fillStyle = equipment.blanket.color;
    ctx.globalAlpha = 0.75;
    ctx.beginPath(); ctx.ellipse(2, -4 - bodyBob, 16, 9, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Body
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(2, -3 - bodyBob, 20, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(color, -35); ctx.lineWidth = 1; ctx.stroke();

  // Body shading (isometric lighting from top-left)
  const bodyGrad = ctx.createLinearGradient(-20, -14, 20, 8);
  bodyGrad.addColorStop(0, shadeColor(color, 20));
  bodyGrad.addColorStop(1, shadeColor(color, -15));
  ctx.fillStyle = bodyGrad;
  ctx.globalAlpha = 0.35;
  ctx.beginPath(); ctx.ellipse(2, -3 - bodyBob, 20, 11, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // Saddle
  if (equipment && equipment.saddle) {
    ctx.fillStyle = equipment.saddle.color;
    ctx.beginPath(); ctx.ellipse(4, -9 - bodyBob, 9, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = shadeColor(equipment.saddle.color, -30); ctx.lineWidth = 1; ctx.stroke();
  }

  // Front legs
  ctx.strokeStyle = shadeColor(color, -20);
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(10, 0 - bodyBob); ctx.lineTo(12 - legAnim*0.3, 16 - bodyBob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(16, 2 - bodyBob); ctx.lineTo(18 + legAnim*0.3, 18 - bodyBob); ctx.stroke();

  // Hooves
  ctx.fillStyle = '#222';
  [[-12 + legAnim*0.3, 19 - bodyBob], [-1 - legAnim*0.3, 21-bodyBob],
   [12 - legAnim*0.3, 17-bodyBob], [18 + legAnim*0.3, 19-bodyBob]].forEach(([hx,hy]) => {
    ctx.beginPath(); ctx.ellipse(hx, hy+1, 3, 2, 0, 0, Math.PI*2); ctx.fill();
  });

  // Neck
  ctx.strokeStyle = color; ctx.lineWidth = 9;
  ctx.beginPath(); ctx.moveTo(14, -6 - bodyBob); ctx.quadraticCurveTo(20, -14-bodyBob, 22, -20-bodyBob); ctx.stroke();

  // Head
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(25, -22 - bodyBob, 8, 5.5, 0.35, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = shadeColor(color,-30); ctx.lineWidth=1; ctx.stroke();

  // Nose/muzzle
  ctx.fillStyle = shadeColor(color, 10);
  ctx.beginPath(); ctx.ellipse(30, -18 - bodyBob, 4.5, 3.5, 0.3, 0, Math.PI*2); ctx.fill();

  // Nostril
  ctx.fillStyle = shadeColor(color, -40);
  ctx.beginPath(); ctx.arc(32, -17 - bodyBob, 1.2, 0, Math.PI*2); ctx.fill();

  // Eye
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(23, -24 - bodyBob, 2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(23, -24 - bodyBob, 0.8, 0, Math.PI*2); ctx.fill();

  // Mane
  ctx.strokeStyle = shadeColor(color, -55); ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.moveTo(15, -8-bodyBob); ctx.quadraticCurveTo(18, -16-bodyBob, 22, -20-bodyBob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(12, -6-bodyBob); ctx.quadraticCurveTo(15, -14-bodyBob, 20, -18-bodyBob); ctx.stroke();

  // Tail
  ctx.strokeStyle = shadeColor(color, -45); ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(-16, -2-bodyBob); ctx.quadraticCurveTo(-26, 6-bodyBob, -24, 18-bodyBob); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-16, -2-bodyBob); ctx.quadraticCurveTo(-28, 4-bodyBob, -30, 0-bodyBob); ctx.stroke();
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-16, -2-bodyBob); ctx.quadraticCurveTo(-25, 8-bodyBob, -20, 22-bodyBob); ctx.stroke();

  // Bridle
  if (equipment && equipment.bridle) {
    ctx.strokeStyle = equipment.bridle.color; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(25, -21-bodyBob, 6, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22,-16-bodyBob); ctx.lineTo(24,-13-bodyBob); ctx.stroke();
  }

  ctx.restore();
}

// ===== DRAW RIDER =====
function drawRider(ctx, sx, sy, direction, outfit) {
  ctx.save();
  ctx.translate(sx, sy);

  let angle = direction==='left'?0.4:direction==='right'?-0.4:direction==='up'?0.2:-0.2;
  ctx.rotate(angle);

  // Boots/lower legs
  ctx.fillStyle = outfit.bootsColor || '#2c1810';
  ctx.fillRect(-5, -10, 4, 7);
  ctx.fillRect(3, -10, 4, 7);

  // Pants
  ctx.fillStyle = outfit.pantsColor || '#FFFFFF';
  ctx.beginPath();
  ctx.ellipse(0, -18, 7, 5, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillRect(-5, -22, 10, 8);

  // Jacket body
  ctx.fillStyle = outfit.jacketColor || '#1a3a5c';
  ctx.fillRect(-6, -36, 13, 16);

  // Left arm
  ctx.fillStyle = shadeColor(outfit.jacketColor || '#1a3a5c', -20);
  ctx.fillRect(-10, -36, 4, 10);
  // Right arm
  ctx.fillStyle = outfit.jacketColor || '#1a3a5c';
  ctx.fillRect(7, -35, 4, 10);

  // Hands
  ctx.fillStyle = '#F5C5A0';
  ctx.beginPath(); ctx.arc(-8, -26, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -25, 2.5, 0, Math.PI*2); ctx.fill();

  // Head/face
  ctx.fillStyle = '#F5C5A0';
  ctx.beginPath(); ctx.arc(1, -44, 6, 0, Math.PI*2); ctx.fill();

  // Helmet
  ctx.fillStyle = outfit.helmetColor || '#1a1a1a';
  ctx.beginPath(); ctx.arc(1, -44, 6.5, Math.PI, 0); ctx.fill();
  ctx.fillRect(-7, -44, 15, 3);

  // Helmet brim
  ctx.fillStyle = shadeColor(outfit.helmetColor || '#1a1a1a', -15);
  ctx.fillRect(-8, -44, 17, 2);

  ctx.restore();
}

function shadeColor(hex, amount) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.max(0,Math.min(255,r+amount));
  g = Math.max(0,Math.min(255,g+amount));
  b = Math.max(0,Math.min(255,b+amount));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// World tile → screen pixel (isometric projection with camera rotation)
function tileToScreen(tx, ty) {
  if (camRotation !== 0 && Game.player) {
    const ptx = Game.player.x / TILE, pty = Game.player.y / TILE;
    const dx = tx - ptx, dy = ty - pty;
    let rx, ry;
    switch (camRotation) {
      case 1: rx = -dy; ry =  dx; break;  // 90° CW camera
      case 2: rx = -dx; ry = -dy; break;  // 180°
      case 3: rx =  dy; ry = -dx; break;  // 270° CW camera
    }
    tx = rx + ptx; ty = ry + pty;
  }
  return {
    x: (tx - ty) * (ISO_W / 2) - cam.x + CANVAS_W / 2 + camPan.x,
    y: (tx + ty) * (ISO_H / 2) - cam.y + CANVAS_H / 3 + camPan.y
  };
}
function worldToScreen(wx, wy) {
  return tileToScreen(wx / TILE, wy / TILE);
}

function drawIsoDiamond(ctx, sx, sy, color, strokeColor) {
  ctx.beginPath();
  ctx.moveTo(sx,          sy - ISO_H/2);
  ctx.lineTo(sx + ISO_W/2, sy);
  ctx.lineTo(sx,          sy + ISO_H/2);
  ctx.lineTo(sx - ISO_W/2, sy);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  if (strokeColor) { ctx.strokeStyle = strokeColor; ctx.lineWidth = 0.5; ctx.stroke(); }
}

function drawIsoBlock(ctx, sx, sy, topColor, wallH) {
  const h = wallH || ISO_Z;
  // Left face (darkest)
  ctx.beginPath();
  ctx.moveTo(sx - ISO_W/2, sy - h);
  ctx.lineTo(sx, sy - h + ISO_H/2);
  ctx.lineTo(sx, sy + ISO_H/2);
  ctx.lineTo(sx - ISO_W/2, sy);
  ctx.closePath();
  ctx.fillStyle = shadeColor(topColor, -60);
  ctx.fill();
  // Right face
  ctx.beginPath();
  ctx.moveTo(sx, sy - h + ISO_H/2);
  ctx.lineTo(sx + ISO_W/2, sy - h);
  ctx.lineTo(sx + ISO_W/2, sy);
  ctx.lineTo(sx, sy + ISO_H/2);
  ctx.closePath();
  ctx.fillStyle = shadeColor(topColor, -35);
  ctx.fill();
  // Top face
  drawIsoDiamond(ctx, sx, sy - h, topColor, 'rgba(0,0,0,0.1)');
}

// ===== NPC =====
class NPC {
  constructor(name, horseColor, startR, startC) {
    this.name = name;
    this.x = startC*TILE+24;
    this.y = startR*TILE+24;
    this.dir = 'down';
    this.horse = new Horse(Math.floor(Math.random()*10), name+"s Pferd");
    this.horse.color = horseColor;
    this.animT = 0;
    this.moving = false;
    this.wanderTimer = Math.random()*3;
    this.wanderDir = null;
    this.wanderDuration = 0;
    this.speed = 60;
  }
  update(dt, world) {
    this.animT += dt;
    this.wanderTimer -= dt;
    if (this.wanderTimer <= 0) {
      const dirs = ['up','down','left','right',null,null];
      this.wanderDir = dirs[Math.floor(Math.random()*dirs.length)];
      this.wanderDuration = 0.5 + Math.random()*1.5;
      this.wanderTimer = this.wanderDuration + Math.random()*2;
    }
    if (this.wanderDir) {
      const speed = this.speed;
      let nx=this.x, ny=this.y;
      if (this.wanderDir==='up') { ny-=speed*dt; this.dir='up'; }
      else if (this.wanderDir==='down') { ny+=speed*dt; this.dir='down'; }
      else if (this.wanderDir==='left') { nx-=speed*dt; this.dir='left'; }
      else if (this.wanderDir==='right') { nx+=speed*dt; this.dir='right'; }
      if (!this._collides(nx, this.y, world)) this.x=nx;
      if (!this._collides(this.x, ny, world)) this.y=ny;
      this.x=Math.max(TILE,Math.min((WORLD_W-2)*TILE,this.x));
      this.y=Math.max(TILE,Math.min((WORLD_H-2)*TILE,this.y));
      this.moving = true;
    } else { this.moving = false; }
  }
  _collides(px, py, world) {
    const hw=8;
    const corners = [[px-hw,py-hw],[px+hw,py-hw],[px-hw,py+hw],[px+hw,py+hw]];
    for (const [cx,cy] of corners) {
      const r=Math.floor(cy/TILE), c=Math.floor(cx/TILE);
      if (world.isSolid(r,c)) return true;
    }
    return false;
  }
}

// ===== INPUT =====
const Input = {
  keys: {},
  init() {
    window.addEventListener('keydown', e => {
      const k = e.key.toLowerCase();
      if (!this.keys[k]) {
        this.keys[k] = true;
        this.onKeyDown(k, e);
      }
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()) ||
          ['w','a','s','d'].includes(k)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => {
      this.keys[e.key.toLowerCase()] = false;
    });
  },
  onKeyDown(k, e) {
    if (k==='e') Game.interact();
    if (k==='l') Game.toggleLead();
    if (k==='escape') UI.closePanel();
    if (k==='tab') { e.preventDefault(); UI.toggleInventory(); }
    if (k===' ') Game.actionPress();
    if (k==='c') { camPan.x=0; camPan.y=0; UI.notify('Kamera zentriert'); }
    if (k==='q') { camRotation=(camRotation+3)%4; camPan.x=0; camPan.y=0; }
    if (k==='r') { camRotation=(camRotation+1)%4; camPan.x=0; camPan.y=0; }
  },
  isDown(k) { return !!this.keys[k]; }
};

// ===== TRAINING MINI-GAME =====
const Training = {
  active: false,
  phase: 0,
  phases: [],
  phaseTimer: 0,
  totalTime: 0,
  score: 0,
  eventActive: false,
  eventType: null,
  spaceCount: 0,
  phaseComplete: false,

  start() {
    if (!Game.player.activeHorse) { UI.notify('Du brauchst ein Pferd!'); return; }
    this.active = true;
    this.phase = 0;
    this.score = 0;
    this.totalTime = 0;
    this.phases = ['Schritt','Trab','Galopp','Sprung'];
    this.phaseTimer = 3;
    this.eventActive = false;
    this.spaceCount = 0;
    const overlay = document.getElementById('trainingOverlay');
    overlay.style.display = 'flex';
    this.showPhase();
    UI.notify('Training gestartet!');
  },

  showPhase() {
    if (this.phase >= this.phases.length) { this.finish(); return; }
    const task = document.getElementById('trainingTask');
    const instr = document.getElementById('trainingInstruction');
    task.textContent = this.phases[this.phase];
    this.phaseTimer = 3 + Math.random()*2;
    this.eventActive = false;
    this.spaceCount = 0;
    if (this.phase===0) instr.textContent = 'Bewege dich langsam (WASD)';
    else if (this.phase===1) instr.textContent = 'Trab! Drücke W rhythmisch';
    else if (this.phase===2) instr.textContent = 'Galopp! Halte W gedrückt';
    else if (this.phase===3) instr.textContent = 'Sprung! Drücke LEERTASTE';
  },

  update(dt) {
    if (!this.active) return;
    this.totalTime += dt;
    this.phaseTimer -= dt;
    const prog = 1 - this.phaseTimer / 5;
    document.getElementById('trainingProgressBar').style.width = Math.min(100,prog*100)+'%';

    // Random event
    if (!this.eventActive && Math.random() < dt * 0.3) {
      this.eventActive = true;
      this.eventType = Math.random()<0.5 ? 'buck' : 'bolt';
      this.spaceCount = 0;
      const task = document.getElementById('trainingTask');
      const instr = document.getElementById('trainingInstruction');
      if (this.eventType==='buck') {
        task.textContent = '⚠️ Pferd bockt!';
        instr.textContent = 'Drücke LEERTASTE schnell!';
      } else {
        task.textContent = '⚠️ Pferd durchgeht!';
        instr.textContent = 'Lenke mit Pfeiltasten!';
      }
    }

    if (this.eventActive) {
      if (this.eventType==='buck' && this.spaceCount >= 5) {
        this.score += 20; this.eventActive=false; UI.notify('Gut gemacht!'); this.showPhase();
      }
      if (this.eventType==='bolt') {
        if (Input.isDown('arrowleft')||Input.isDown('arrowright')) {
          this.spaceCount++;
          if (this.spaceCount > 30) {
            this.score += 20; this.eventActive=false; UI.notify('Pferd beruhigt!'); this.showPhase();
          }
        }
      }
    }

    if (this.phaseTimer <= 0 && !this.eventActive) {
      this.score += 25;
      this.phase++;
      this.showPhase();
    }
    if (this.phase >= this.phases.length && !this.eventActive) this.finish();
  },

  actionPress() {
    if (!this.active) return;
    if (this.eventActive && this.eventType==='buck') this.spaceCount++;
  },

  finish() {
    this.active = false;
    document.getElementById('trainingOverlay').style.display = 'none';
    const earned = 20 + Math.floor(Math.random()*30);
    Economy.earn(earned, 'Training abgeschlossen!');
    const horse = Game.player.activeHorse;
    if (horse) {
      horse.speed = Math.min(10, horse.speed + 0.1);
      horse.stamina = Math.min(10, horse.stamina + 0.1);
      horse.happiness = Math.min(100, horse.happiness + 10);
    }
    UI.notify('Training beendet! Pferd verbessert!');
  }
};

// ===== TRAIL RIDE =====
const TrailRide = {
  active: false,
  canvas: null,
  ctx: null,
  t: 0,
  playerY: 300,
  jumping: false,
  jumpV: 0,
  obstacles: [],
  coins: [],
  scrollX: 0,
  coinsCollected: 0,
  duration: 20,
  elapsed: 0,
  groundY: 420,
  obstacleTypes: [
    {w:30,h:20,color:'#8B4513',label:'Baumstamm'},
    {w:20,h:15,color:'#4169E1',label:'Pfütze'},
    {w:25,h:30,color:'#228B22',label:'Busch'}
  ],

  start() {
    if (!Game.player.activeHorse) { UI.notify('Du brauchst ein Pferd!'); return; }
    this.active=true; this.t=0; this.elapsed=0; this.coinsCollected=0;
    this.playerY=this.groundY-40; this.jumping=false; this.jumpV=0;
    this.obstacles=[]; this.coins=[]; this.scrollX=0;
    this.canvas=document.getElementById('trailCanvas');
    this.ctx=this.canvas.getContext('2d');
    document.getElementById('trailOverlay').style.display='block';
    this._spawnObstacles();
    UI.notify('Trail-Ausritt gestartet!');
  },

  _spawnObstacles() {
    for (let i=0; i<8; i++) {
      const ot = this.obstacleTypes[Math.floor(Math.random()*this.obstacleTypes.length)];
      this.obstacles.push({x:900+i*280+Math.random()*100, y:this.groundY-ot.h, w:ot.w, h:ot.h, color:ot.color, passed:false});
    }
    for (let i=0; i<12; i++) {
      this.coins.push({x:900+i*200+Math.random()*80, y:this.groundY-60-Math.random()*40, collected:false});
    }
  },

  update(dt) {
    if (!this.active) return;
    this.t += dt;
    this.elapsed += dt;
    const scrollSpeed = 200;
    const sx = scrollSpeed * dt;

    // Move obstacles/coins
    for (const o of this.obstacles) o.x -= sx;
    for (const c of this.coins) c.x -= sx;

    // Player jump
    if ((Input.isDown('arrowup')||Input.isDown('w')) && !this.jumping) {
      this.jumping=true; this.jumpV=-500;
    }
    if (this.jumping) {
      this.jumpV += 1000*dt;
      this.playerY += this.jumpV*dt;
      if (this.playerY >= this.groundY-40) {
        this.playerY=this.groundY-40; this.jumping=false; this.jumpV=0;
      }
    }

    // Collision with obstacles
    const px=130, py=this.playerY, pw=40, ph=40;
    for (const o of this.obstacles) {
      if (!o.passed && o.x < px+pw && o.x+o.w > px && o.y < py+ph && o.y+o.h > py) {
        o.passed=true; UI.notify('Hindernis verfehlt!');
      }
      if (!o.passed && o.x+o.w < px) o.passed=true;
    }

    // Collect coins
    for (const c of this.coins) {
      if (!c.collected && Math.abs(c.x-px)<25 && Math.abs(c.y-(py+20))<25) {
        c.collected=true; this.coinsCollected++;
      }
    }

    if (this.elapsed >= this.duration) this.finish();
    this.render();
  },

  render() {
    const ctx = this.ctx;
    const W=900, H=600, gY=this.groundY;
    ctx.clearRect(0,0,W,H);
    // Sky
    ctx.fillStyle='#87CEEB';
    ctx.fillRect(0,0,W,H);
    // Background trees
    ctx.fillStyle='#2d5a1b';
    for (let i=0;i<10;i++) {
      const tx=(i*120-this.t*30)%1000;
      ctx.beginPath();
      ctx.arc(tx,gY-80,35,0,Math.PI*2);
      ctx.fill();
      ctx.fillStyle='#5C3317';
      ctx.fillRect(tx-5,gY-50,10,55);
      ctx.fillStyle='#2d5a1b';
    }
    // Ground
    ctx.fillStyle='#4A7C2F';
    ctx.fillRect(0,gY,W,H-gY);
    ctx.fillStyle='#A0896B';
    ctx.fillRect(0,gY-10,W,10);
    // Path
    ctx.fillStyle='#C4A35A';
    ctx.fillRect(0,gY-15,W,5);

    // Progress bar
    const prog = this.elapsed/this.duration;
    ctx.fillStyle='rgba(0,0,0,0.5)';
    ctx.fillRect(10,10,300,20);
    ctx.fillStyle='#4A7C2F';
    ctx.fillRect(10,10,300*prog,20);
    ctx.fillStyle='#fff';
    ctx.font='12px sans-serif';
    ctx.fillText(`Fortschritt: ${Math.floor(prog*100)}%`,15,25);
    ctx.fillText(`Münzen: ${this.coinsCollected}`,320,25);
    ctx.fillText('↑ Springen',750,25);

    // Obstacles
    for (const o of this.obstacles) {
      if (o.x > -50 && o.x < W+50) {
        ctx.fillStyle = o.color;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        if (o.color==='#8B4513') {
          // log detail
          ctx.strokeStyle='#6B3410';
          ctx.lineWidth=2;
          for (let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(o.x+5,o.y+i*7);ctx.lineTo(o.x+o.w-5,o.y+i*7);ctx.stroke();}
        }
      }
    }

    // Coins
    for (const c of this.coins) {
      if (!c.collected && c.x>-20 && c.x<W+20) {
        ctx.fillStyle='#FFD700';
        ctx.beginPath();
        ctx.arc(c.x,c.y,8,0,Math.PI*2);
        ctx.fill();
        ctx.strokeStyle='#FFA500';
        ctx.lineWidth=2;
        ctx.stroke();
      }
    }

    // Player horse
    const horse = Game.player.activeHorse;
    const hc = horse ? horse.color : '#8B4513';
    drawHorse(ctx, 130, this.playerY+20, hc, 'right', this.t*3, horse?horse.equipment:{});
    drawRider(ctx, 130, this.playerY+20, 'right', Game.player.outfit);

    // Time
    const remaining = Math.max(0, this.duration - this.elapsed);
    ctx.fillStyle='#fff';
    ctx.font='bold 16px sans-serif';
    ctx.textAlign='right';
    ctx.fillText(`Zeit: ${remaining.toFixed(1)}s`, W-20, 30);
    ctx.textAlign='left';
  },

  finish() {
    this.active=false;
    document.getElementById('trailOverlay').style.display='none';
    const earned = 30 + this.coinsCollected*5;
    Economy.earn(earned, 'Trail-Ausritt abgeschlossen!');
    UI.notify(`Trail beendet! +${earned} Münzen`);
    if (Game.player.activeHorse) {
      Game.player.activeHorse.happiness = Math.min(100, Game.player.activeHorse.happiness+15);
      Game.player.activeHorse.energy = Math.max(0, Game.player.activeHorse.energy-20);
    }
  }
};

const Tournament = {
  active: false,
  type: null,
  canvas: null,
  ctx: null,

  // Show Jumping
  obstacles: [],
  jumpScore: 0,
  jumpIdx: 0,

  faults: 0,
  // Dressage
  letters: ['A','K','V','E','S','H','C','M'],
  letterKeys: ['a','k','v','e','s','h','c','m'],
  dressagePhase: 0,
  dressageScore: 0,
  dressageTimer: 0,
  dressageResult: null,
  elapsed: 0,

  showSelection() {
    if (!Game.player.activeHorse) { UI.notify('Du brauchst ein Pferd!'); return; }
    UI.showPanel('Turnier wählen', `
      <div style="display:flex;gap:16px;justify-content:center;margin-top:16px;">

    UI.closePanel();
    this.active=true; this.type=type; this.t=0; this.elapsed=0;
    this.canvas=document.getElementById('tournCanvas');
    this.ctx=this.canvas.getContext('2d');
    const overlay=document.getElementById('tournamentOverlay');
    overlay.style.display='flex';
    overlay.style.pointerEvents='all';
    if (type==='jumping') {
      this.obstacles=[]; this.faults=0; this.jumpIdx=0; this.jumpState='approach'; this.jumpTimer=2; this.jumpWindow=false;

      UI.notify('Springturnier beginnt! Drücke LEERTASTE zum richtigen Zeitpunkt!');
    } else {
      this.dressagePhase=0; this.dressageScore=0; this.dressageTimer=3; this.dressageResult=null;

  _updateJumping(dt) {
    const scrollSpeed=120;
    for (const o of this.obstacles) o.x -= scrollSpeed*dt;

    // Current obstacle approaching
    if (this.jumpIdx < this.obstacles.length) {
      const o = this.obstacles[this.jumpIdx];
      if (o.x < 280 && o.x > 200 && !this.jumpWindow) {
        this.jumpWindow=true; this.windowTimer=0.5;
      }
      if (this.jumpWindow) {
        this.windowTimer-=dt;
        if (this.windowTimer<=0 && !o.passed && !o.missed) {
          o.missed=true; this.faults+=4; this.jumpWindow=false;
          UI.notify('Fehler! +4 Strafpunkte');
          this.jumpIdx++;
        }
      }
      if (o.x < 100) { if(!o.passed&&!o.missed){o.missed=true;this.jumpIdx++;} }
    }
    if (this.jumpIdx >= this.obstacles.length && this.obstacles[this.obstacles.length-1].x < 100) {
      this.finish();
    }
  },

  actionPress() {
    if (!this.active) return;
    if (this.type==='jumping' && this.jumpWindow) {
      const o = this.obstacles[this.jumpIdx];
      if (o && !o.passed) {
        o.passed=true;
        this.jumpWindow=false;
        UI.notify('Perfekter Sprung!');
        this.jumpIdx++;
      }
    }
  },

  _updateDressage(dt) {
    if (this.dressageResult!==null) {
      this.elapsed+=dt;
      if (this.elapsed>3) this.finish();
      return;
    }
    this.dressageTimer-=dt;
    if (this.dressageTimer<=0) {
      this.dressagePhase++;
      if (this.dressagePhase>=8) { this.dressageResult='done'; return; }
      this.dressageTimer=2.5;
    }
  },

  _dressageKeyPress(k) {
    if (!this.active||this.type!=='dressage') return;
    if (this.dressageResult!==null) return;
    const expected=this.letterKeys[this.dressagePhase];
    const timeLeft=this.dressageTimer/2.5;
    if (k===expected) {
      const pts = Math.floor(timeLeft*15)+5;
      this.dressageScore+=pts;
      UI.notify(`Korrekt! +${pts} Punkte`);
      this.dressagePhase++;
      this.dressageTimer=2.5;
      if (this.dressagePhase>=8) this.dressageResult='done';
    } else {
      UI.notify('Falsche Taste!');
    }
  },

  _render() {
    const ctx=this.ctx, W=900,H=600;
    ctx.clearRect(0,0,W,H);
    if (this.type==='jumping') this._renderJumping(ctx,W,H);
    else this._renderDressage(ctx,W,H);
  },

  _renderJumping(ctx,W,H) {
    // Sky
    ctx.fillStyle='#87CEEB'; ctx.fillRect(0,0,W,H);
    // Ground
    ctx.fillStyle='#4A7C2F'; ctx.fillRect(0,380,W,220);
    ctx.fillStyle='#C4A35A'; ctx.fillRect(0,370,W,15);

    // Obstacles
    for (const o of this.obstacles) {
      if (o.x>-60&&o.x<W+60) {
        // Poles
        ctx.fillStyle=o.color;
        ctx.fillRect(o.x-5,340,10,40);
        ctx.fillRect(o.x+45,340,10,40);
        // Bar
        ctx.fillStyle= o.passed?'#888': o.missed?'#FF4444':o.color;
        ctx.fillRect(o.x,330,55,8);
        // Stands
        ctx.fillStyle='#888';
        ctx.fillRect(o.x-8,370,8,15);
        ctx.fillRect(o.x+55,370,8,15);
      }
    }

    // Ideal jump zone indicator
    if (this.jumpWindow) {
      ctx.fillStyle='rgba(0,255,0,0.3)';
      ctx.fillRect(200,300,80,100);
      ctx.strokeStyle='#0f0';
      ctx.lineWidth=2;
      ctx.strokeRect(200,300,80,100);
      ctx.fillStyle='#0f0';
      ctx.font='bold 14px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('JETZT! [LEERTASTE]',240,295);
    }

    // Player horse + rider
    const jumpAnim = this.jumpWindow ? -30 : 0;
    const horse=Game.player.activeHorse;
    drawHorse(ctx,150,350+jumpAnim,horse?horse.color:'#8B4513','right',this.t*3,horse?horse.equipment:{});
    drawRider(ctx,150,350+jumpAnim,'right',Game.player.outfit);

    // HUD
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.fillRect(0,0,W,50);
    ctx.fillStyle='#fff';
    ctx.font='16px sans-serif';
    ctx.textAlign='left';
    ctx.fillText(`Hindernisse: ${this.jumpIdx}/${this.obstacles.length}`,10,30);
    ctx.fillStyle='#FF6666';
    ctx.fillText(`Strafpunkte: ${this.faults}`,250,30);
    ctx.fillStyle='#FFD700';
    ctx.fillText('Springen!',W/2-40,30);
    ctx.fillStyle='#aaa';
    ctx.textAlign='right';
    ctx.fillText('ESC: Abbrechen',W-10,30);
    ctx.textAlign='left';
  },

  _renderDressage(ctx,W,H) {
    ctx.fillStyle='#C4A35A'; ctx.fillRect(0,0,W,H);
    // Arena border
    ctx.strokeStyle='#8B6914'; ctx.lineWidth=6;
    ctx.strokeRect(80,80,W-160,H-160);

    // Arena letters
    const positions = [
      {l:'A',x:W/2,y:H-60},{l:'K',x:120,y:H-120},{l:'V',x:120,y:H/2+60},
      {l:'E',x:120,y:H/2},{l:'S',x:120,y:H/2-60},{l:'H',x:120,y:120},
      {l:'C',x:W/2,y:70},{l:'M',x:W-120,y:120}
    ];
    for (const p of positions) {
      const isActive = this.letters[this.dressagePhase]===p.l;
      ctx.fillStyle= isActive?'#FFD700':'#333';
      ctx.font=`bold ${isActive?28:20}px sans-serif`;
      ctx.textAlign='center';
      ctx.fillText(p.l,p.x,p.y);
    }

    // Current instruction
    if (this.dressagePhase<8 && this.dressageResult===null) {
      ctx.fillStyle='rgba(0,0,0,0.8)';
      ctx.fillRect(W/2-150,20,300,50);
      ctx.fillStyle='#FFD700';
      ctx.font='bold 20px sans-serif';
      ctx.textAlign='center';
      ctx.fillText(`Drücke: "${this.letterKeys[this.dressagePhase].toUpperCase()}" für ${this.letters[this.dressagePhase]}`,W/2,50);
      // Timer bar
      const frac=this.dressageTimer/2.5;
      ctx.fillStyle='rgba(0,0,0,0.5)';
      ctx.fillRect(W/2-150,75,300,12);
      ctx.fillStyle= frac>0.5?'#4A7C2F':'#FF6600';
      ctx.fillRect(W/2-150,75,300*frac,12);
    }

    // Score
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,200,40);
    ctx.fillStyle='#FFD700';
    ctx.font='16px sans-serif';
    ctx.textAlign='left';
    ctx.fillText(`Punkte: ${this.dressageScore}`,10,26);

    // Phase dots
    for (let i=0;i<8;i++) {
      ctx.fillStyle= i<this.dressagePhase?'#4A7C2F': i===this.dressagePhase?'#FFD700':'#555';
      ctx.beginPath();
      ctx.arc(W/2-100+i*28,H-30,8,0,Math.PI*2);
      ctx.fill();
    }

    // Horse in center
    const horse=Game.player.activeHorse;
    drawHorse(ctx,W/2,H/2,horse?horse.color:'#8B4513','right',this.t,horse?horse.equipment:{});
    drawRider(ctx,W/2,H/2,'right',Game.player.outfit);

    if (this.dressageResult==='done') {
      ctx.fillStyle='rgba(0,0,0,0.7)';
      ctx.fillRect(W/2-200,H/2-60,400,120);
      ctx.fillStyle='#FFD700';
      ctx.font='bold 28px sans-serif';
      ctx.textAlign='center';
      ctx.fillText('Dressur abgeschlossen!',W/2,H/2-20);
      ctx.fillStyle='#fff';
      ctx.font='20px sans-serif';
      ctx.fillText(`Endpunktzahl: ${this.dressageScore}`,W/2,H/2+20);
    }
    ctx.textAlign='left';
  },

  finish() {
    this.active=false;
    const overlay=document.getElementById('tournamentOverlay');
    overlay.style.display='none';
    overlay.style.pointerEvents='none';

    let placement, earned;
    if (this.type==='jumping') {
      const perf = Math.max(0, 100-this.faults*5);
      placement = perf>=80?1:perf>=50?2:3;
    } else {
      const maxScore=8*20;
      placement = this.dressageScore>=maxScore*0.8?1:this.dressageScore>=maxScore*0.5?2:3;
    }
    if (placement===1) earned=200;
    else if (placement===2) earned=100;
    else earned=50;

    Economy.earn(earned, `Turnier abgeschlossen!`);
    const medals=['🥇','🥈','🥉'];
    UI.showPanel('Turnierergebnis', `
      <div style="text-align:center;padding:20px">
        <div style="font-size:60px">${medals[placement-1]}</div>
        <div style="font-size:22px;color:#FFD700;margin:12px 0">${placement}. Platz!</div>
        <div style="color:#90EE90;font-size:18px">+${earned} Münzen</div>
        ${this.type==='jumping'?`<div style="color:#aaa;margin-top:8px">Strafpunkte: ${this.faults}</div>`:`<div style="color:#aaa;margin-top:8px">Punkte: ${this.dressageScore}</div>`}
        <button class="btn btn-primary" style="margin-top:16px;padding:10px 24px" onclick="UI.closePanel()">Schließen</button>
      </div>
    `);
  }
};

// ===== ISOMETRIC TILE RENDERER =====
// sx,sy = screen center of the diamond tile
function isoPath(ctx, sx, sy) {
  ctx.beginPath();
  ctx.moveTo(sx, sy-ISO_H/2); ctx.lineTo(sx+ISO_W/2, sy);
  ctx.lineTo(sx, sy+ISO_H/2); ctx.lineTo(sx-ISO_W/2, sy); ctx.closePath();
}
function isoDiamondGrad(ctx, sx, sy, c0, c1) {
  const g = ctx.createLinearGradient(sx-ISO_W/2, sy-ISO_H/2, sx+ISO_W/2, sy+ISO_H/2);
  g.addColorStop(0, c0); g.addColorStop(1, c1);
  isoPath(ctx, sx, sy); ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.07)'; ctx.lineWidth = 0.5; ctx.stroke();
}

function drawTile(ctx, tileType, sx, sy, time) {
  switch(tileType) {
    case T.GRASS: {
      isoDiamondGrad(ctx, sx, sy, '#5a9035', '#3a6520');
      ctx.strokeStyle = '#2d5018'; ctx.lineWidth = 0.7;
      for(let i=0;i<3;i++){const bx=sx-16+i*16,by=sy-5+i*4;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+2,by-6);ctx.stroke();ctx.beginPath();ctx.moveTo(bx+5,by-1);ctx.lineTo(bx+3,by-5);ctx.stroke();}
      break;
    }
    case T.FLOWER: {
      isoDiamondGrad(ctx, sx, sy, '#5a9035', '#3a6520');
      const fc=['#FF6B8A','#FFD700','#EE44CC','#FF8C00'];
      for(let i=0;i<3;i++){
        const fx=sx-14+i*14, fy=sy-4+i*3, col=fc[i%fc.length];
        for(let p=0;p<5;p++){const a=(p/5)*Math.PI*2;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(fx+Math.cos(a)*3.5,fy+Math.sin(a)*3.5,2.5,1.8,a,0,Math.PI*2);ctx.fill();}
        ctx.fillStyle='#FFE820';ctx.beginPath();ctx.arc(fx,fy,2,0,Math.PI*2);ctx.fill();
      }
      break;
    }
    case T.DIRT: {
      isoDiamondGrad(ctx, sx, sy, '#9B7320', '#6a4e10');
      ctx.fillStyle='rgba(0,0,0,0.12)';
      ctx.beginPath();ctx.ellipse(sx-8,sy+2,5,2,0.3,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.ellipse(sx+10,sy-2,4,1.5,0.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='rgba(180,140,60,0.25)';
      ctx.beginPath();ctx.ellipse(sx+2,sy-5,3,1.5,-0.3,0,Math.PI*2);ctx.fill();
      break;
    }
    case T.STABLE_FLOOR: {
      isoDiamondGrad(ctx, sx, sy, '#D0A068', '#A87840');
      ctx.strokeStyle='rgba(90,50,15,0.25)'; ctx.lineWidth=1;
      for(let i=-1;i<=1;i++){const lx=sx+i*22,ly=sy+i*11;ctx.beginPath();ctx.moveTo(lx-ISO_W/2,ly+ISO_H/4);ctx.lineTo(lx+ISO_W/2,ly-ISO_H/4);ctx.stroke();}
      ctx.strokeStyle='rgba(90,50,15,0.15)'; ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(sx-ISO_W/2,sy);ctx.lineTo(sx,sy-ISO_H/2);ctx.stroke();
      break;
    }
    case T.STALL: {
      isoDiamondGrad(ctx, sx, sy, '#C08848', '#906030');
      ctx.strokeStyle='#D4A840'; ctx.lineWidth=0.8;
      for(let i=0;i<4;i++){const ox=(i-1.5)*10,oy=(i-1.5)*5;ctx.beginPath();ctx.moveTo(sx+ox-6,sy+oy);ctx.lineTo(sx+ox+8,sy+oy-4);ctx.stroke();}
      ctx.strokeStyle='#5C3A1A'; ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(sx,sy-ISO_H/2);ctx.lineTo(sx,sy+ISO_H/2);ctx.stroke();
      break;
    }
    case T.WALL: {
      const h=ISO_Z*1.6;
      // Left face with bricks
      ctx.beginPath();ctx.moveTo(sx-ISO_W/2,sy-h);ctx.lineTo(sx,sy-h+ISO_H/2);ctx.lineTo(sx,sy+ISO_H/2);ctx.lineTo(sx-ISO_W/2,sy);ctx.closePath();
      const lf=ctx.createLinearGradient(sx-ISO_W/2,0,sx,0); lf.addColorStop(0,'#787878'); lf.addColorStop(1,'#606060');
      ctx.fillStyle=lf; ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.25)'; ctx.lineWidth=0.8;
      for(let r=0;r<3;r++){const ry=sy-h+(r+1)*(h/3);ctx.beginPath();ctx.moveTo(sx-ISO_W/2,ry);ctx.lineTo(sx,ry+ISO_H/4);ctx.stroke();}
      ctx.beginPath();ctx.moveTo(sx-ISO_W/4,sy-h+ISO_H/4);ctx.lineTo(sx-ISO_W/4,sy-ISO_H/4);ctx.stroke();
      // Right face with bricks
      ctx.beginPath();ctx.moveTo(sx,sy-h+ISO_H/2);ctx.lineTo(sx+ISO_W/2,sy-h);ctx.lineTo(sx+ISO_W/2,sy);ctx.lineTo(sx,sy+ISO_H/2);ctx.closePath();
      const rf=ctx.createLinearGradient(sx,0,sx+ISO_W/2,0); rf.addColorStop(0,'#484848'); rf.addColorStop(1,'#383838');
      ctx.fillStyle=rf; ctx.fill();
      for(let r=0;r<3;r++){const ry=sy-h+ISO_H/2+(r+1)*((h-ISO_H/2)/3);ctx.beginPath();ctx.moveTo(sx,ry);ctx.lineTo(sx+ISO_W/2,ry-ISO_H/4);ctx.stroke();}
      ctx.beginPath();ctx.moveTo(sx+ISO_W/4,sy-h+ISO_H/4*3);ctx.lineTo(sx+ISO_W/4,sy-ISO_H/4);ctx.stroke();
      // Top
      drawIsoDiamond(ctx, sx, sy-h, '#909090', 'rgba(0,0,0,0.08)');
      break;
    }
    case T.FENCE: {
      isoDiamondGrad(ctx, sx, sy, '#4f8830', '#3a6520');
      // Post with grain
      const gf=ctx.createLinearGradient(sx-4,0,sx+4,0); gf.addColorStop(0,'#C07848'); gf.addColorStop(0.5,'#9A5830'); gf.addColorStop(1,'#784020');
      ctx.fillStyle=gf; ctx.fillRect(sx-3,sy-ISO_Z*0.85,6,ISO_Z*0.85);
      ctx.fillStyle='#C8844A'; ctx.fillRect(sx-4,sy-ISO_Z*0.87,8,4);
      // Rails with iso perspective
      const rc='#8A5028';
      const rails=[[0.6,0.47],[0.3,0.17]];
      for(const [t,b] of rails){
        ctx.fillStyle=rc;
        ctx.beginPath();ctx.moveTo(sx-ISO_W/2,sy-ISO_Z*t);ctx.lineTo(sx,sy-ISO_Z*t-ISO_H/4);ctx.lineTo(sx,sy-ISO_Z*b-ISO_H/4);ctx.lineTo(sx-ISO_W/2,sy-ISO_Z*b);ctx.closePath();ctx.fill();
        ctx.fillStyle=shadeColor(rc,-20);
        ctx.beginPath();ctx.moveTo(sx,sy-ISO_Z*t-ISO_H/4);ctx.lineTo(sx+ISO_W/2,sy-ISO_Z*t);ctx.lineTo(sx+ISO_W/2,sy-ISO_Z*b);ctx.lineTo(sx,sy-ISO_Z*b-ISO_H/4);ctx.closePath();ctx.fill();
      }
      break;
    }
    case T.TREE: {
      isoDiamondGrad(ctx, sx, sy, '#2a5815', '#1a3a0a');
      // Tapered trunk
      ctx.fillStyle='#3e2008';
      ctx.beginPath();ctx.moveTo(sx-7,sy);ctx.lineTo(sx+7,sy);ctx.lineTo(sx+4,sy-ISO_Z*2.6);ctx.lineTo(sx-4,sy-ISO_Z*2.6);ctx.closePath();ctx.fill();
      ctx.strokeStyle='#2a1405'; ctx.lineWidth=0.8;
      ctx.beginPath();ctx.moveTo(sx-2,sy-4);ctx.lineTo(sx-3,sy-ISO_Z*2.5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx+3,sy-8);ctx.lineTo(sx+2,sy-ISO_Z*2.5);ctx.stroke();
      // Canopy layers
      [{x:-3,y:3.3,r:30,c:'#0a3806'},{x:6,y:3.8,r:24,c:'#165510'},{x:-7,y:4.2,r:20,c:'#1e6c18'},{x:2,y:4.7,r:16,c:'#288520'}].forEach(({x,y,r,c})=>{
        ctx.fillStyle=c;ctx.beginPath();ctx.arc(sx+x,sy-ISO_Z*y,r,0,Math.PI*2);ctx.fill();
      });
      ctx.fillStyle='rgba(60,140,30,0.28)';ctx.beginPath();ctx.arc(sx-9,sy-ISO_Z*4.6,11,0,Math.PI*2);ctx.fill();
      break;
    }
    case T.WATER: {
      const wg=ctx.createLinearGradient(sx-ISO_W/2,sy-ISO_H/2,sx+ISO_W/2,sy+ISO_H/2);
      wg.addColorStop(0,'#1848b0'); wg.addColorStop(1,'#082880');
      isoPath(ctx,sx,sy); ctx.fillStyle=wg; ctx.fill();
      ctx.strokeStyle='rgba(100,180,255,0.3)'; ctx.lineWidth=1; ctx.stroke();
      const sh=0.22+Math.sin(time*1.8)*0.1;
      ctx.fillStyle=`rgba(130,210,255,${sh})`;
      for(let i=0;i<3;i++){const wx=sx-20+i*20+Math.sin(time*0.9+i*1.4)*5,wy=sy-2+Math.cos(time*0.7+i)*3;ctx.beginPath();ctx.ellipse(wx,wy,10+i*2,3,0.1,0,Math.PI*2);ctx.fill();}
      const sp=Math.abs(Math.sin(time*2.5));
      ctx.fillStyle=`rgba(255,255,255,${sp*0.5})`;ctx.beginPath();ctx.arc(sx+8,sy-6+Math.sin(time*1.5)*3,2,0,Math.PI*2);ctx.fill();
      break;
    }
    case T.ARENA: {
      isoDiamondGrad(ctx, sx, sy, '#D8B870', '#B09040');
      ctx.strokeStyle='rgba(100,70,20,0.2)'; ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(sx-12,sy-3);ctx.lineTo(sx+12,sy+6);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx-6,sy+5);ctx.lineTo(sx+10,sy-2);ctx.stroke();
      break;
    }
    case T.PATH: {
      isoDiamondGrad(ctx, sx, sy, '#B8A080', '#887860');
      ctx.fillStyle='rgba(70,50,25,0.18)';
      [[sx-14,sy-4,0.2],[sx+2,sy-8,0.0],[sx+16,sy-1,-0.1],[sx-7,sy+5,0.3],[sx+9,sy+2,0.1]].forEach(([cx,cy,ang])=>{
        ctx.beginPath();ctx.ellipse(cx,cy,7,3.5,ang,0,Math.PI*2);ctx.fill();
        ctx.strokeStyle='rgba(50,35,15,0.25)';ctx.lineWidth=0.6;ctx.stroke();
      });
      break;
    }
    case T.PADDOCK: {
      isoDiamondGrad(ctx, sx, sy, '#70a050', '#507838');
      ctx.fillStyle='rgba(90,150,55,0.35)';
      ctx.beginPath();ctx.ellipse(sx-8,sy,10,5,-0.3,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#3a6020'; ctx.lineWidth=0.6;
      ctx.beginPath();ctx.moveTo(sx+6,sy-6);ctx.lineTo(sx+8,sy-11);ctx.stroke();
      ctx.beginPath();ctx.moveTo(sx-10,sy+2);ctx.lineTo(sx-8,sy-3);ctx.stroke();
      break;
    }
    default:
      drawIsoDiamond(ctx, sx, sy, '#4A7C2F', 'rgba(0,0,0,0.05)');
  }
}

// ===== CAMERA =====
const cam = { x: 0, y: 0 };
const camPan = { x: 0, y: 0 };   // user-controlled offset (right-click drag)
let camRotation = 0;              // 0=SW view, 1=NW, 2=NE, 3=SE (90° CW steps)
function updateCamera(player) {
  const tx = player.x / TILE, ty = player.y / TILE;
  cam.x = (tx - ty) * (ISO_W / 2);
  cam.y = (tx + ty) * (ISO_H / 2);
}

// ===== GAME =====
const Game = {
  world: null,
  player: null,
  npcs: [],
  canvas: null,
  ctx: null,
  lastTime: 0,
  time: 0,
  minimapCanvas: null,
  minimapCtx: null,
  minimapDirty: true,
  interactionZone: null,

  init() {
    this.canvas = document.getElementById('gameCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.minimapCanvas = document.getElementById('minimap');
    this.minimapCtx = this.minimapCanvas.getContext('2d');
    this.world = new World();
    this.player = new Player();
    this.npcs = [
      new NPC('Lena',  '#B8860B', 8,  52),
      new NPC('Max',   '#4A3728', 12, 64),
      new NPC('Sophie','#C4A27A', 6,  55),
      new NPC('Tom',   '#D4882A', 10, 61)
    ];
    Input.init();
    UI.init();
    this.drawMinimap();

    // Right-click drag to pan camera
    let dragStart = null;
    this.canvas.addEventListener('mousedown', e => {
      if (e.button === 1 || e.button === 2) {
        dragStart = { mx: e.clientX, my: e.clientY, px: camPan.x, py: camPan.y };
        e.preventDefault();
      }
    });
    window.addEventListener('mousemove', e => {
      if (!dragStart) return;
      camPan.x = dragStart.px + (e.clientX - dragStart.mx);
      camPan.y = dragStart.py + (e.clientY - dragStart.my);
    });
    window.addEventListener('mouseup', e => {
      if (e.button === 1 || e.button === 2) dragStart = null;
    });
    this.canvas.addEventListener('contextmenu', e => e.preventDefault());
    requestAnimationFrame(ts => this.gameLoop(ts));
  },

  gameLoop(timestamp) {
    const dt = Math.min((timestamp - this.lastTime)/1000, 0.05);
    this.lastTime = timestamp;
    this.time += dt;
    this.update(dt);
    this.render();
    requestAnimationFrame(ts => this.gameLoop(ts));
  },

  update(dt) {
    // Don't update world movement during mini-games
    if (Training.active) { Training.update(dt); return; }
    if (TrailRide.active) { TrailRide.update(dt); return; }
    if (Tournament.active) { Tournament.update(dt); return; }

    this.movePlayer(dt);
    for (const npc of this.npcs) npc.update(dt, this.world);
    if (this.player.activeHorse) this.player.animT += dt;
    this.checkInteractions();
    updateCamera(this.player);
    UI.updateStatus(this.getStatusText());
  },

  movePlayer(dt) {
    const p = this.player;
    const spd = p.activeHorse ? 250 : 150;
    let dx=0, dy=0;
    // Movement directions rotate with camera so WASD stays screen-relative
    const D=[
      {w:[-1,-1],s:[1,1],  a:[-1,1], d:[1,-1]},
      {w:[-1,1], s:[1,-1], a:[1,1],  d:[-1,-1]},
      {w:[1,1],  s:[-1,-1],a:[1,-1], d:[-1,1]},
      {w:[1,-1], s:[-1,1], a:[-1,-1],d:[1,1]},
    ][camRotation];
    if (Input.isDown('w')||Input.isDown('arrowup'))    { dx+=D.w[0]; dy+=D.w[1]; p.dir='up'; }
    if (Input.isDown('s')||Input.isDown('arrowdown'))  { dx+=D.s[0]; dy+=D.s[1]; p.dir='down'; }
    if (Input.isDown('a')||Input.isDown('arrowleft'))  { dx+=D.a[0]; dy+=D.a[1]; p.dir='left'; }
    if (Input.isDown('d')||Input.isDown('arrowright')) { dx+=D.d[0]; dy+=D.d[1]; p.dir='right'; }

    if (dx!==0||dy!==0) {
      const len=Math.sqrt(dx*dx+dy*dy);
      const nx=p.x+dx/len*spd*dt;
      const ny=p.y+dy/len*spd*dt;
      if (!this.collidesAt(nx, p.y)) p.x=nx;
      if (!this.collidesAt(p.x, ny)) p.y=ny;
      p.x=Math.max(TILE/2,Math.min((WORLD_W)*TILE-TILE/2,p.x));
      p.y=Math.max(TILE/2,Math.min((WORLD_H)*TILE-TILE/2,p.y));
      p.animT+=dt;
      p.moving=true;
    } else {
      p.moving=false;
    }

    // Lead horse follows player
    if (p.leadHorse) {
      const lh=p.leadHorse;
      const ldx=p.x-lh.x, ldy=p.y-lh.y;
      const ldist=Math.sqrt(ldx*ldx+ldy*ldy);
      if (ldist>80) {
        const spd2=100;
        lh.x+=ldx/ldist*spd2*dt;
        lh.y+=ldy/ldist*spd2*dt;
        if (ldx<0) lh.dir='left'; else if(ldx>0) lh.dir='right';
        else if (ldy<0) lh.dir='up'; else lh.dir='down';
      }
    }
  },

  collidesAt(px, py) {
    const hw=10;
    const corners=[[px-hw,py-hw],[px+hw,py-hw],[px-hw,py+hw],[px+hw,py+hw]];
    for (const [cx,cy] of corners) {
      const r=Math.floor(cy/TILE), c=Math.floor(cx/TILE);
      if (this.world.isSolid(r,c)) return true;
    }
    return false;
  },

  checkInteractions() {
    const p=this.player;
    const pr=p.tileR(), pc=p.tileC();
    this.interactionZone=null;

    // Near stable door (shop inside stable)
    if (pr>=6&&pr<=14&&pc>=31&&pc<=44) {
      // Near stalls
      const stallCols=[[31,35],[40,44]];
      const stallRows=[6,8,10];
      for (const sr of stallRows) {
        for (const [sc1,sc2] of stallCols) {
          if (pr>=sr&&pr<=sr+1&&pc>=sc1&&pc<=sc2) {
            UI.showPrompt('E: Stallmanagement');
            this.interactionZone={type:'stall', stallId:stallRows.indexOf(sr)};
            return;
          }
        }
      }
      // North wall = shop area
      if (pr<=8&&pc>=32&&pc<=43) {
        UI.showPrompt('E: Shop öffnen');
        this.interactionZone={type:'shop'};
        return;
      }
    }

    // Near stable door from outside
    if (pr===15&&(pc===37||pc===38)||pr===16&&(pc===36||pc===37||pc===38||pc===39)) {
      UI.showPrompt('E: Stall betreten');
      this.interactionZone={type:'stable_enter'};
    }

    // Arena entrance
    if ((pr===37||pr===38)&&(pc===14||pc===15)) {
      UI.showPrompt('E: Training starten | T: Turnier');
      this.interactionZone={type:'arena'};
      return;
    }

    // Trail entrance
    if (pr>=37&&pr<=42&&pc>=32&&pc<=38) {
      UI.showPrompt('E: Trail-Ausritt starten');
      this.interactionZone={type:'trail'};
      return;
    }

    // Near paddock horses (NPCs)
    for (const npc of this.npcs) {
      const dx=p.x-npc.x, dy=p.y-npc.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if (dist<80) {
        if (!p.activeHorse && p.horses.length>0) {
          UI.showPrompt(`E: ${npc.name} begrüßen`);
          this.interactionZone={type:'npc', npc};
        } else {
          UI.showPrompt(`E: ${npc.name} begrüßen`);
          this.interactionZone={type:'npc', npc};
        }
        return;
      }
    }

    // Tournament sign area (inside/near arena north area)
    if (pr>=22&&pr<=26&&pc>=15&&pc<=22) {
      UI.showPrompt('E: Turnier starten');
      this.interactionZone={type:'tournament'};
      return;
    }

    if (!this.interactionZone) UI.hidePrompt();
  },

  interact() {
    if (Training.active||TrailRide.active||Tournament.active) return;
    if (document.getElementById('panel').style.display==='block') { UI.closePanel(); return; }
    if (!this.interactionZone) return;
    const z=this.interactionZone;
    if (z.type==='shop') UI.showShop();
    else if (z.type==='stall') UI.showStallMenu(z.stallId);
    else if (z.type==='arena') Training.start();
    else if (z.type==='trail') TrailRide.start();
    else if (z.type==='tournament') Tournament.showSelection();
    else if (z.type==='stable_enter') UI.notify('Willkommen im Stall! Gehe zu den Ständen oder zum Shop.');
    else if (z.type==='npc') {
      const npc=z.npc;
      UI.notify(`${npc.name}: "Hallo! Schöner Tag zum Reiten!"`);
    }
  },

  actionPress() {
    if (Training.active) Training.actionPress();
    if (Tournament.active) Tournament.actionPress();
  },

  toggleLead() {
    const p=this.player;
    if (p.leadHorse) {
      p.leadHorse=null;
      UI.notify('Pferd losgelassen');
    } else if (p.horses.length>0&&!p.activeHorse) {
      p.leadHorse=p.horses[0];
      UI.notify(`${p.horses[0].name} am Führstrick`);
    }
  },

  buyHorse(breedIdx) {
    const p=this.player;
    const b=BREEDS[breedIdx];
    if (!Economy.spend(b.cost)) { UI.notify('Nicht genug Münzen!'); return; }
    const h=new Horse(breedIdx, b.name);
    h.x=p.x+60; h.y=p.y;
    p.horses.push(h);
    UI.notify(`${b.name} gekauft!`);
    if (p.horses.length===1) { p.activeHorse=h; UI.notify('Aufgesessen!'); }
    UI.showShop();
  },

  buyEquip(category, itemName) {
    const p=this.player;
    const items=EQUIPMENT_ITEMS[category];
    const item=items.find(i=>i.name===itemName);
    if (!item) return;
    if (!Economy.spend(item.cost)) { UI.notify('Nicht genug Münzen!'); return; }
    p.inventory[category].push(item);
    UI.notify(`${item.name} gekauft!`);
    UI.showShop();
  },

  equipItem(type, itemName) {
    const p=this.player;
    const horse=p.activeHorse;
    if (!horse) { UI.notify('Kein Pferd aktiv!'); return; }
    const allItems=[...p.inventory.saddles,...p.inventory.bridles,...p.inventory.blankets];
    const item=allItems.find(i=>i.name===itemName);
    if (!item) return;
    if (horse.equipment[type]===item) {
      horse.equipment[type]=null;
      UI.notify(`${item.name} abgelegt`);
    } else {
      horse.equipment[type]=item;
      UI.notify(`${item.name} angelegt!`);
    }
  },

  setActiveHorse(idx) {
    const p=this.player;
    if (p.activeHorse===p.horses[idx]) {
      p.activeHorse=null;
      UI.notify('Abgesessen');
    } else {
      p.activeHorse=p.horses[idx];
      UI.notify(`Aufgesessen auf ${p.horses[idx].name}!`);
    }
  },

  setOutfitColor(key, color) {
    Game.player.outfit[key]=color;
  },

  feedHorse(idx) {
    const p=this.player;
    const h=p.horses[idx];
    if (!h) return;
    h.energy=Math.min(100,h.energy+20);
    h.happiness=Math.min(100,h.happiness+5);
    Economy.earn(10,'Pferd gefüttert!');
    UI.notify(`${h.name} gefüttert! Energie +20`);
  },

  groomHorse(idx) {
    const p=this.player;
    const h=p.horses[idx];
    if (!h) return;
    h.happiness=Math.min(100,h.happiness+15);
    Economy.earn(15,'Pferd gepflegt!');
    UI.notify(`${h.name} gepflegt! Glück +15`);
  },

  getStatusText() {
    const p=this.player;
    const r=p.tileR(), c=p.tileC();
    const tName=['Gras','Blume','Erde','Stallboden','Stand','Wand','Zaun','Baum','Wasser','Arena','Pfad','Koppel'];
    const tileName=tName[this.world.get(r,c)]||'?';
    let status=`Pos:(${c},${r}) Tile:${tileName}`;
    if (p.activeHorse) status+=` | Pferd: ${p.activeHorse.name}`;
    if (p.leadHorse) status+=` | Führt: ${p.leadHorse.name}`;
    return status;
  },

  drawMinimap() {
    const ctx=this.minimapCtx;
    const W=88,H=88;
    const scaleX=W/WORLD_W, scaleY=H/WORLD_H;
    ctx.clearRect(0,0,W,H);
    const colors={
      [T.GRASS]:'#4A7C2F',[T.FLOWER]:'#FF6B8A',[T.DIRT]:'#8B6914',
      [T.STABLE_FLOOR]:'#D4A574',[T.STALL]:'#C4944A',[T.WALL]:'#696969',
      [T.FENCE]:'#8B4513',[T.TREE]:'#1a5a0a',[T.WATER]:'#4169E1',
      [T.ARENA]:'#C4A35A',[T.PATH]:'#A0896B',[T.PADDOCK]:'#5a9040'
    };
    for (let r=0;r<WORLD_H;r++) {
      for (let c=0;c<WORLD_W;c++) {
        const t=this.world.get(r,c);
        ctx.fillStyle=colors[t]||'#4A7C2F';
        ctx.fillRect(c*scaleX, r*scaleY, scaleX+0.5, scaleY+0.5);
      }
    }
    ctx.fillStyle='rgba(0,0,0,0.3)';
    ctx.fillRect(0,0,W,H);
  },

  updateMinimap() {
    const ctx=this.minimapCtx;
    const W=88,H=88;
    const scaleX=W/WORLD_W, scaleY=H/WORLD_H;
    const p=this.player;
    // Player dot
    const px=p.x/TILE*scaleX, py=p.y/TILE*scaleY;
    ctx.clearRect(0,0,W,H);
    // Redraw would be slow; just use existing background and draw dots
    if (this.minimapDirty) { this.drawMinimap(); this.minimapDirty=false; }
    ctx.fillStyle='#FF0';
    ctx.beginPath();
    ctx.arc(px,py,2.5,0,Math.PI*2);
    ctx.fill();
    // NPCs
    for (const npc of this.npcs) {
      ctx.fillStyle='#FF6600';
      ctx.beginPath();
      ctx.arc(npc.x/TILE*scaleX, npc.y/TILE*scaleY, 1.5, 0, Math.PI*2);
      ctx.fill();
    }
  },

  render() {
    const ctx = this.ctx;
    const p = this.player;

    // Sky gradient background
    const skyGrad = ctx.createLinearGradient(0, 0, 0, CANVAS_H * 0.6);
    skyGrad.addColorStop(0, '#4A90D9');
    skyGrad.addColorStop(1, '#87CEEB');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    const objects = [];

    // Collect tiles (with viewport culling)
    for (let ty = 0; ty < WORLD_H; ty++) {
      for (let tx = 0; tx < WORLD_W; tx++) {
        const pos = tileToScreen(tx, ty);
        if (pos.x > -ISO_W*2 && pos.x < CANVAS_W + ISO_W*2 && pos.y > -200 && pos.y < CANVAS_H + 300) {
          objects.push({ depth: tx + ty, subDepth: 0, type: 'tile', tx, ty, tile: this.world.get(ty, tx), sx: pos.x, sy: pos.y });
        }
      }
    }

    // Tournament sign
    const signTX = 18, signTY = 23;
    const signPos = tileToScreen(signTX, signTY);
    objects.push({ depth: signTX + signTY, subDepth: 0.5, type: 'sign', sx: signPos.x, sy: signPos.y });

    // Lead horse
    if (p.leadHorse) {
      const lpos = worldToScreen(p.leadHorse.x, p.leadHorse.y);
      if (lpos.x > -100 && lpos.x < CANVAS_W + 100) {
        objects.push({ depth: p.leadHorse.x/TILE + p.leadHorse.y/TILE, subDepth: 1, type: 'leadhorse', sx: lpos.x, sy: lpos.y });
      }
    }

    // NPCs
    for (const npc of this.npcs) {
      const npos = worldToScreen(npc.x, npc.y);
      if (npos.x > -100 && npos.x < CANVAS_W + 100) {
        objects.push({ depth: npc.x/TILE + npc.y/TILE, subDepth: 1, type: 'npc', npc, sx: npos.x, sy: npos.y });
      }
    }

    // Player
    const ppos = worldToScreen(p.x, p.y);
    objects.push({ depth: p.x/TILE + p.y/TILE, subDepth: 1, type: 'player', sx: ppos.x, sy: ppos.y });

    // Z-sort: by depth, then subDepth (entities after tiles at same depth)
    objects.sort((a, b) => a.depth - b.depth || a.subDepth - b.subDepth);

    // Draw lead rope line (before sorted objects, in world space order)
    if (p.leadHorse) {
      const lpos = worldToScreen(p.leadHorse.x, p.leadHorse.y);
      ctx.strokeStyle = '#8B4513';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(ppos.x, ppos.y);
      ctx.lineTo(lpos.x, lpos.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Draw all sorted objects
    for (const obj of objects) {
      if (obj.type === 'tile') {
        drawTile(ctx, obj.tile, obj.sx, obj.sy, this.time);
      } else if (obj.type === 'player') {
        if (p.activeHorse) {
          drawHorse(ctx, obj.sx, obj.sy, p.activeHorse.color, p.dir, p.animT, p.activeHorse.equipment);
          drawRider(ctx, obj.sx, obj.sy - 18, p.dir, p.outfit);
        } else {
          this._drawWalker(ctx, obj.sx, obj.sy, p.dir, p.animT, p.outfit);
        }
      } else if (obj.type === 'npc') {
        const npc = obj.npc;
        drawHorse(ctx, obj.sx, obj.sy, npc.horse.color, npc.dir, npc.animT, {});
        drawRider(ctx, obj.sx, obj.sy - 30, npc.dir, {helmetColor:'#333',jacketColor:'#8B0000',pantsColor:'#F0F0F0',bootsColor:'#1a1a1a'});
        // Name tag
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        const tw = ctx.measureText(npc.name).width;
        ctx.fillRect(obj.sx - tw/2 - 4, obj.sy - 80, tw + 8, 18);
        ctx.fillStyle = '#FFD700';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(npc.name, obj.sx, obj.sy - 67);
        ctx.textAlign = 'left';
      } else if (obj.type === 'leadhorse') {
        drawHorse(ctx, obj.sx, obj.sy, p.leadHorse.color, p.leadHorse.dir, this.time, p.leadHorse.equipment);
      } else if (obj.type === 'sign') {
        // Tournament sign
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(obj.sx - 2, obj.sy - 50, 4, 32);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(obj.sx - 26, obj.sy - 50, 54, 22);
        ctx.fillStyle = '#333';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('TURNIER', obj.sx, obj.sy - 41);
        ctx.fillText('E: Starten', obj.sx, obj.sy - 31);
        ctx.textAlign = 'left';
      }
    }

    // Vignette effect
    const vignette = ctx.createRadialGradient(CANVAS_W/2, CANVAS_H/2, CANVAS_H*0.3, CANVAS_W/2, CANVAS_H/2, CANVAS_H*0.8);
    vignette.addColorStop(0, 'rgba(0,0,0,0)');
    vignette.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

    // Compass rose (top-right corner)
    const compassLabels = ['↖N', '↗N', '↘N', '↙N'];
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath(); ctx.arc(CANVAS_W - 30, 30, 22, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(compassLabels[camRotation], CANVAS_W - 30, 27);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '8px sans-serif';
    ctx.fillText('Q / R', CANVAS_W - 30, 40);
    ctx.textAlign = 'left';

    this.updateMinimap();
  },

  _drawWalker(ctx, x, y, dir, t, outfit) {
    ctx.save();
    ctx.translate(x, y);

    let angle = dir==='left'?0.4:dir==='right'?-0.4:dir==='up'?0.2:-0.2;
    ctx.rotate(angle);

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 5, 10, 4, 0, 0, Math.PI*2);
    ctx.fill();

    const walkAnim = Math.sin(t*6)*4;
    // Boots
    ctx.fillStyle = outfit.bootsColor || '#2c1810';
    ctx.fillRect(-7, -22+walkAnim, 5, 8);
    ctx.fillRect(3, -22-walkAnim, 5, 8);
    // Pants
    ctx.fillStyle = outfit.pantsColor || '#FFFFFF';
    ctx.fillRect(-7, -34, 15, 14);
    // Jacket
    ctx.fillStyle = outfit.jacketColor || '#1a3a5c';
    ctx.fillRect(-7, -47, 15, 15);
    // Arms
    const armAnim = Math.sin(t*6)*5;
    ctx.fillRect(-11, -47+armAnim, 4, 10);
    ctx.fillRect(8, -47-armAnim, 4, 10);
    // Head
    ctx.fillStyle = '#F5C5A0';
    ctx.beginPath(); ctx.arc(0, -54, 6, 0, Math.PI*2); ctx.fill();
    // Helmet
    ctx.fillStyle = outfit.helmetColor || '#1a1a1a';
    ctx.beginPath(); ctx.arc(0, -54, 6.5, Math.PI, 0); ctx.fill();
    ctx.fillRect(-7, -54, 14, 3);

    ctx.restore();
  }
};

// Hook dressage key presses
const origOnKeyDown=Input.onKeyDown.bind(Input);
Input.onKeyDown=function(k,e){
  origOnKeyDown(k,e);
  if(Tournament.active&&Tournament.type==='dressage') Tournament._dressageKeyPress(k);
};

// Start game
Game.init();
</script>
