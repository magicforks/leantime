<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pferdesimulation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a2e; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
#gameContainer { position: relative; width: 900px; height: 600px; }
canvas { display: block; border: 2px solid #4A7C2F; }
.ui-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
#moneyDisplay { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #FFD700; padding: 8px 14px; border-radius: 8px; font-size: 16px; font-weight: bold; pointer-events: none; border: 1px solid #FFD700; }
#interactPrompt { position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #fff; padding: 6px 14px; border-radius: 6px; font-size: 13px; display: none; pointer-events: none; border: 1px solid #888; }
#notifications { position: absolute; top: 60px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; z-index: 100; }
.notification { background: rgba(0,0,0,0.85); color: #FFD700; padding: 8px 20px; border-radius: 8px; font-size: 14px; border: 1px solid #FFD700; animation: fadeNotif 2s forwards; white-space: nowrap; }
@keyframes fadeNotif { 0%{opacity:0;transform:translateY(-10px)} 15%{opacity:1;transform:translateY(0)} 75%{opacity:1} 100%{opacity:0;transform:translateY(-10px)} }
#panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: rgba(20,20,35,0.97); color: #eee; border-radius: 12px; padding: 20px; border: 2px solid #4A7C2F; min-width: 380px; max-width: 700px; max-height: 560px; overflow-y: auto; pointer-events: all; z-index: 50; display: none; }
#panel h2 { color: #FFD700; margin-bottom: 14px; text-align: center; font-size: 20px; }
#panel .close-btn { position: absolute; top: 10px; right: 14px; cursor: pointer; color: #aaa; font-size: 20px; background: none; border: none; line-height: 1; }
#panel .close-btn:hover { color: #fff; }
.shop-section { margin-bottom: 16px; }
.shop-section h3 { color: #90EE90; font-size: 15px; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
.shop-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; margin-bottom: 5px; background: rgba(255,255,255,0.05); border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
.shop-item .item-name { font-size: 13px; }
.shop-item .item-price { color: #FFD700; font-size: 13px; min-width: 60px; text-align: right; }
.btn { padding: 5px 12px; border-radius: 5px; border: none; cursor: pointer; font-size: 12px; font-weight: bold; transition: background 0.15s; }
.btn-buy { background: #2d7a2d; color: #fff; }
.btn-buy:hover { background: #3a9e3a; }
.btn-buy:disabled { background: #555; color: #999; cursor: not-allowed; }
.btn-equip { background: #1a3a7a; color: #fff; }
.btn-equip:hover { background: #2a5aaa; }
.btn-action { background: #7a3a1a; color: #fff; }
.btn-action:hover { background: #aa5a2a; }
.btn-primary { background: #4A7C2F; color: #fff; margin-top: 8px; }
.btn-primary:hover { background: #5a9c3f; }
.horse-shop-box { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.13); border-radius: 8px; padding: 10px; text-align: center; transition: border-color 0.18s; }
.horse-shop-box:hover { border-color: rgba(255,215,0,0.45); }
#statusBar { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #ddd; padding: 5px 10px; border-radius: 6px; font-size: 12px; pointer-events: none; }
#minimap { position: absolute; top: 10px; left: 10px; border: 1px solid #555; border-radius: 4px; pointer-events: none; }
.horse-stat { font-size: 11px; color: #aaa; margin-top: 3px; }
.stat-bar { display: inline-block; height: 6px; background: #4A7C2F; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
.inventory-tabs { display: flex; gap: 6px; margin-bottom: 12px; }
.inv-tab { padding: 5px 12px; border: 1px solid #555; border-radius: 5px; cursor: pointer; font-size: 12px; background: rgba(255,255,255,0.05); color: #ccc; }
.inv-tab.active { background: #4A7C2F; color: #fff; border-color: #4A7C2F; }
.inv-content { display: none; }
.inv-content.active { display: block; }
.color-picker-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.color-swatch { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; transition: border-color 0.1s; }
.color-swatch:hover, .color-swatch.selected { border-color: #FFD700; }
#trainingOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; flex-direction: column; pointer-events: none; z-index: 40; }
#trainingTask { color: #FFD700; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
#trainingInstruction { color: #fff; font-size: 16px; margin-top: 8px; }
#trainingProgress { width: 300px; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; margin-top: 12px; overflow: hidden; }
#trainingProgressBar { height: 100%; background: #4A7C2F; width: 0%; transition: width 0.1s; }
#trailOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a3a1a; display: none; z-index: 45; pointer-events: none; }
#trailCanvas { display: block; }
#tournamentOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 44; pointer-events: none; }
#cameraHint { position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); font-size: 10px; color: rgba(255,255,255,0.45); pointer-events: none; white-space: nowrap; }
#horseMenu { position: absolute; display: none; background: rgba(18,12,4,0.94); border: 1px solid #7a5628; border-radius: 8px; padding: 5px 0; min-width: 155px; z-index: 100; box-shadow: 0 4px 14px rgba(0,0,0,0.6); }
#horseMenu .hm-title { color: #FFD700; font-weight: bold; font-size: 13px; padding: 4px 12px 6px; border-bottom: 1px solid #4a3010; margin-bottom: 3px; }
#horseMenu button { display: block; width: 100%; text-align: left; background: none; border: none; color: #e0c888; padding: 6px 14px; font-size: 12px; cursor: pointer; font-family: 'Segoe UI', sans-serif; }
#horseMenu button:hover { background: rgba(180,120,40,0.3); color: #FFD700; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="gameCanvas" width="900" height="600"></canvas>
  <div class="ui-overlay">
    <div id="moneyDisplay">💰 <span id="moneyAmt">500</span></div>
    <canvas id="minimap" width="88" height="88"></canvas>
    <div id="interactPrompt"></div>
    <div id="notifications"></div>
    <div id="statusBar"></div>
    <div id="cameraHint">Rechtsklick + Ziehen = Kamera drehen/neigen &nbsp;|&nbsp; Scrollrad = Zoom &nbsp;|&nbsp; Q/R = 90° Drehen &nbsp;|&nbsp; C = Reset</div>
    <div id="horseMenu"></div>
  </div>
  <div id="panel">
    <button class="close-btn" id="panelClose">✕</button>
    <h2 id="panelTitle">Shop</h2>
    <div id="panelContent"></div>
  </div>
  <div id="trainingOverlay">
    <div id="trainingTask"></div>
    <div id="trainingInstruction"></div>
    <div id="trainingProgress"><div id="trainingProgressBar"></div></div>
  </div>
  <div id="trailOverlay">
    <canvas id="trailCanvas" width="900" height="600"></canvas>
  </div>
  <div id="tournamentOverlay">
    <canvas id="tournCanvas" width="900" height="600"></canvas>
  </div>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
